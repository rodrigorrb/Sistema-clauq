<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Copiloto · Análise de Ações B3</title>
<meta name="description" content="Copiloto de decisão para investidores brasileiros. Análise fundamentalista com IA." />
<meta name="theme-color" content="#080c0e" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&family=Syne:wght@400;600;700;800&display=swap" />

<style>
/* ── Reset & Variables ─────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg0:#080c0e;--bg1:#0d1316;--bg2:#131a1e;--bg3:#1a2228;--bg4:#222c33;
  --bdr:#1f2d35;--bdr2:#2a3d48;
  --grn:#00e676;--grn2:#00c96655;--grn3:#00e67618;
  --red:#ff3d57;--red2:#ff3d5730;
  --yel:#ffd740;--yel2:#ffd74028;
  --blu:#40c4ff;--blu2:#40c4ff20;
  --t1:#e8f0f4;--t2:#8ba8b8;--t3:#4a6070;
  --mono:'IBM Plex Mono',monospace;
  --disp:'Syne',sans-serif;
}
html{scroll-behavior:smooth}
body{background:var(--bg0);color:var(--t1);font-family:var(--mono);min-height:100vh;overflow-x:hidden}
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-track{background:var(--bg1)}
::-webkit-scrollbar-thumb{background:var(--bdr2);border-radius:2px}

/* ── Animations ────────────────────────────────────────────── */
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 #00e67620}50%{box-shadow:0 0 18px 4px #00e67620}}
@keyframes cursor{0%,100%{opacity:1}50%{opacity:0}}
@keyframes slideIn{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:translateX(0)}}

.fu{animation:fadeUp .4s cubic-bezier(.22,1,.36,1) both}
.fu1{animation-delay:.05s}.fu2{animation-delay:.10s}.fu3{animation-delay:.15s}
.fu4{animation-delay:.20s}.fu5{animation-delay:.25s}.fu6{animation-delay:.30s}

/* ── Scanline ──────────────────────────────────────────────── */
#scanline{
  pointer-events:none;position:fixed;inset:0;z-index:9999;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.05) 2px,rgba(0,0,0,.05) 4px);
}

/* ── Layout ────────────────────────────────────────────────── */
.wrap{max-width:520px;margin:0 auto;padding:0 16px 60px}
.topbar{
  border-bottom:1px solid var(--bdr);padding:14px 0;
  display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;
  position:sticky;top:0;background:var(--bg0);z-index:100;
}
.logo{display:flex;align-items:center;gap:10px}
.logo-icon{
  width:28px;height:28px;background:var(--grn);border-radius:6px;
  display:flex;align-items:center;justify-content:center;
  font-size:15px;color:#000;font-weight:800;
}
.logo-name{font-family:var(--disp);font-weight:800;font-size:17px;letter-spacing:-.02em}
.badge{
  font-size:9px;letter-spacing:.08em;padding:2px 7px;border-radius:3px;font-weight:600;
  background:var(--grn2);color:var(--grn);border:1px solid #00e67640;
}

/* ── Cards ─────────────────────────────────────────────────── */
.card{background:var(--bg2);border:1px solid var(--bdr);border-radius:8px}
.card-b{background:var(--bg3);border:1px solid var(--bdr2);border-radius:8px}

/* ── Buttons ────────────────────────────────────────────────── */
.btn-p{
  background:var(--grn);color:#000;border:none;border-radius:6px;
  font-family:var(--disp);font-weight:800;font-size:13px;letter-spacing:.04em;
  cursor:pointer;transition:all .18s;display:flex;align-items:center;gap:6px;
  padding:12px 20px;
}
.btn-p:hover{filter:brightness(1.1);transform:translateY(-1px)}
.btn-p:disabled{opacity:.4;cursor:not-allowed;transform:none}

.btn-g{
  background:transparent;color:var(--t2);border:1px solid var(--bdr2);border-radius:6px;
  font-family:var(--mono);font-size:11px;cursor:pointer;transition:all .18s;
  padding:6px 12px;
}
.btn-g:hover{border-color:var(--grn);color:var(--grn);background:var(--grn3)}
.btn-g.active{border-color:var(--grn);color:var(--grn);background:var(--grn3)}

/* ── Input ─────────────────────────────────────────────────── */
input[type=text]{
  background:var(--bg3);border:1px solid var(--bdr2);border-radius:6px;
  color:var(--t1);font-family:var(--mono);font-size:15px;letter-spacing:.06em;
  outline:none;transition:border-color .18s,box-shadow .18s;padding:12px 16px;width:100%;
}
input[type=text]:focus{border-color:var(--grn);box-shadow:0 0 0 3px var(--grn3)}
input[type=text]::placeholder{color:var(--t3)}

/* ── Spinner ────────────────────────────────────────────────── */
.spin{
  width:15px;height:15px;border:2px solid var(--bdr2);border-top-color:var(--grn);
  border-radius:50%;animation:spin .7s linear infinite;display:inline-block;flex-shrink:0;
}

/* ── Score Ring ─────────────────────────────────────────────── */
.ring-wrap{position:relative;width:100px;height:100px;flex-shrink:0}
.ring-wrap svg{transform:rotate(-90deg)}
.ring-inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-num{font-family:var(--disp);font-weight:800;font-size:24px;line-height:1}
.ring-lbl{font-size:8px;color:var(--t3);letter-spacing:.1em;margin-top:2px}

/* ── Metric card ─────────────────────────────────────────────── */
.metric{padding:13px 15px;display:flex;flex-direction:column;gap:3px}
.metric-lbl{font-size:9px;color:var(--t3);letter-spacing:.08em}
.metric-val{font-family:var(--disp);font-weight:800;font-size:20px;line-height:1.1}
.metric-sub{font-size:9px;color:var(--t3);margin-top:1px}

/* ── Score bars ─────────────────────────────────────────────── */
.sbar-row{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.sbar-lbl{font-size:10px;color:var(--t2);width:82px;flex-shrink:0}
.sbar-track{flex:1;height:3px;background:var(--bg4);border-radius:2px;overflow:hidden}
.sbar-fill{height:100%;border-radius:2px;transition:width 1.2s cubic-bezier(.22,1,.36,1)}
.sbar-val{font-size:10px;width:22px;text-align:right;flex-shrink:0}
.sbar-max{font-size:9px;color:var(--t3);width:26px;text-align:right;flex-shrink:0}

/* ── Cenário cards ─────────────────────────────────────────── */
.cen{padding:13px 14px;border-radius:8px;flex:1}
.cen-tipo{font-size:9px;letter-spacing:.1em;margin-bottom:5px}
.cen-val{font-family:var(--disp);font-weight:800;font-size:21px}
.cen-sub{font-size:10px;color:var(--t3);margin-top:3px}

/* ── AI output ─────────────────────────────────────────────── */
.ai-box{padding:16px;max-height:400px;overflow-y:auto;line-height:1.6}
.ai-h3{font-family:var(--disp);font-weight:700;font-size:13px;color:var(--t1);margin:16px 0 7px}
.ai-h3:first-child{margin-top:0}
.ai-bullet{display:flex;gap:7px;margin-bottom:5px;animation:slideIn .3s ease both}
.ai-bullet-arrow{color:var(--grn);flex-shrink:0;margin-top:1px}
.ai-bullet-text{font-size:12px;color:var(--t2);line-height:1.55}
.ai-p{font-size:12px;color:var(--t2);line-height:1.6;margin-bottom:6px}
.ai-hr{border:none;border-top:1px solid var(--bdr);margin:10px 0}
.ai-disc{font-size:10px;color:var(--t3)}
.ai-cursor::after{content:'▋';animation:cursor 1s infinite;color:var(--grn)}

/* ── Watchlist row ──────────────────────────────────────────── */
.wl-row{
  padding:13px 15px;display:flex;align-items:center;gap:12px;
  cursor:pointer;transition:background .15s;border-radius:8px;
}
.wl-row:hover{background:var(--bg3)}

/* ── Warning box ─────────────────────────────────────────────── */
.warn{padding:12px 14px;background:var(--yel2);border:1px solid #ffd74030;border-radius:8px}
.warn-title{font-size:10px;color:var(--yel);letter-spacing:.08em;margin-bottom:4px}
.warn-text{font-size:11px;color:var(--t3);line-height:1.55}

/* ── Misc ────────────────────────────────────────────────────── */
.section-label{font-size:10px;color:var(--t3);letter-spacing:.1em;margin-bottom:10px}
.pos{color:var(--grn)}.neg{color:var(--red)}.neu{color:var(--yel)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.flex-row{display:flex;gap:8px}
.flex-col{display:flex;flex-direction:column;gap:8px}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt20{margin-top:20px}.mt28{margin-top:28px}
.mb8{margin-bottom:8px}.mb16{margin-bottom:16px}
.divider{border:none;border-top:1px solid var(--bdr);margin:10px 0}

/* Perfil chips row */
.chip-row{display:flex;gap:6px;flex-wrap:wrap}
</style>
</head>
<body>
<div id="scanline"></div>
<div id="app"></div>

<script type="module">
import { h, render } from 'https://esm.sh/preact@10.19.3';
import { useState, useRef, useEffect, useCallback } from 'https://esm.sh/preact@10.19.3/hooks';
import { html } from 'https://esm.sh/htm@3.1.1/preact';

// ── CHAVE DA API ──────────────────────────────────────────────────────────────
// ATENÇÃO: Para uso pessoal/POC apenas. Nunca exponha chaves em produção pública.
// Substitua pela sua chave em: https://console.anthropic.com
const ANTHROPIC_API_KEY = "SUA_CHAVE_AQUI";

// ── DADOS MOCK (simulando API de mercado) ─────────────────────────────────────
const STOCKS = {
  PETR4:{name:"Petrobras PN",sector:"Energia / Petróleo",price:38.72,change:+1.84,pct:+4.99,pl:4.2,pvp:1.1,roe:26.3,dy:14.8,margem:24.7,cresc:18.2,divEbt:1.24,gov:"N2",vol:"R$ 1.2Bi",maxA:44.10,minA:29.80,score:{lucro:22,divida:15,divid:14,cresc:20,gov:9,total:80}},
  VALE3:{name:"Vale ON",sector:"Mineração",price:62.15,change:-0.93,pct:-1.47,pl:5.8,pvp:1.4,roe:22.1,dy:9.6,margem:38.0,cresc:11.4,divEbt:0.73,gov:"NM",vol:"R$ 980Mi",maxA:74.80,minA:52.40,score:{lucro:20,divida:18,divid:12,cresc:18,gov:13,total:81}},
  ITUB4:{name:"Itaú Unibanco PN",sector:"Financeiro / Bancos",price:34.48,change:+0.22,pct:+0.64,pl:8.9,pvp:2.1,roe:20.8,dy:5.4,margem:35.6,cresc:9.8,divEbt:null,gov:"N1",vol:"R$ 740Mi",maxA:38.90,minA:27.60,score:{lucro:18,divida:16,divid:8,cresc:16,gov:11,total:69}},
  WEGE3:{name:"WEG ON",sector:"Indústria / Eletroeletrônicos",price:52.30,change:+0.85,pct:+1.65,pl:31.2,pvp:10.8,roe:34.5,dy:1.8,margem:21.7,cresc:28.4,divEbt:0.26,gov:"NM",vol:"R$ 320Mi",maxA:58.90,minA:43.20,score:{lucro:24,divida:20,divid:5,cresc:25,gov:15,total:89}},
  BBAS3:{name:"Banco do Brasil ON",sector:"Financeiro / Bancos Públicos",price:24.15,change:-0.40,pct:-1.63,pl:4.1,pvp:0.9,roe:21.3,dy:10.2,margem:36.7,cresc:14.1,divEbt:null,gov:"NM",vol:"R$ 850Mi",maxA:30.10,minA:20.80,score:{lucro:19,divida:14,divid:13,cresc:19,gov:8,total:73}},
  MGLU3:{name:"Magazine Luiza ON",sector:"Varejo / E-commerce",price:8.42,change:-0.28,pct:-3.22,pl:null,pvp:3.2,roe:-8.4,dy:0.0,margem:-2.1,cresc:-14.3,divEbt:4.80,gov:"NM",vol:"R$ 560Mi",maxA:14.90,minA:6.80,score:{lucro:5,divida:6,divid:0,cresc:4,gov:12,total:27}},
  RENT3:{name:"Localiza ON",sector:"Serviços / Locação de Veículos",price:41.70,change:+0.55,pct:+1.34,pl:18.4,pvp:3.8,roe:20.6,dy:1.2,margem:12.3,cresc:16.8,divEbt:3.10,gov:"NM",vol:"R$ 280Mi",maxA:52.30,minA:34.60,score:{lucro:17,divida:11,divid:3,cresc:21,gov:14,total:66}},
};
const SUGESTOES = Object.keys(STOCKS);

// ── HELPERS ───────────────────────────────────────────────────────────────────
const fmt2 = n => n != null ? n.toFixed(2) : "—";
const scoreColor = s => s >= 80 ? "var(--grn)" : s >= 65 ? "var(--yel)" : "var(--red)";
const scoreLabel = s => s >= 80 ? "ÓTIMO" : s >= 65 ? "BOM" : s >= 50 ? "REGULAR" : "FRACO";

// ── SCORE RING ────────────────────────────────────────────────────────────────
function ScoreRing({score}) {
  const r = 40, circ = 2*Math.PI*r, pct = score/100;
  const col = scoreColor(score);
  return html`
    <div class="ring-wrap">
      <svg width="100" height="100">
        <circle cx="50" cy="50" r=${r} fill="none" stroke="var(--bg4)" stroke-width="7"/>
        <circle cx="50" cy="50" r=${r} fill="none" stroke=${col}
          stroke-width="7" stroke-linecap="round"
          stroke-dasharray=${circ} stroke-dashoffset=${circ*(1-pct)}
          style="transition:stroke-dashoffset 1.1s cubic-bezier(.22,1,.36,1);filter:drop-shadow(0 0 5px ${col})"/>
      </svg>
      <div class="ring-inner">
        <span class="ring-num" style="color:${col}">${score}</span>
        <span class="ring-lbl">${scoreLabel(score)}</span>
      </div>
    </div>`;
}

// ── SCORE BAR ─────────────────────────────────────────────────────────────────
function SBar({label, val, max, weight}) {
  const pct = (val/max)*100;
  const col = pct>=80?"var(--grn)":pct>=55?"var(--yel)":"var(--red)";
  return html`
    <div class="sbar-row">
      <span class="sbar-lbl">${label}</span>
      <div class="sbar-track">
        <div class="sbar-fill" style="width:${pct}%;background:${col}"/>
      </div>
      <span class="sbar-val" style="color:${col}">${val}</span>
      <span class="sbar-max">/${weight}</span>
    </div>`;
}

// ── METRIC CARD ───────────────────────────────────────────────────────────────
function Metric({label, value, unit="", color, sub}) {
  return html`
    <div class="card metric">
      <span class="metric-lbl">${label}</span>
      <span class="metric-val" style="color:${color||"var(--t1)"}">
        ${value}<span style="font-size:12px;font-weight:400;color:var(--t2);margin-left:2px">${unit}</span>
      </span>
      ${sub && html`<span class="metric-sub">${sub}</span>`}
    </div>`;
}

// ── AI TEXT RENDERER ──────────────────────────────────────────────────────────
function renderAI(text, streaming) {
  if (!text) return null;
  const lines = text.split('\n');
  const nodes = [];
  let key = 0;
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    if (line.startsWith('## ')) {
      nodes.push(h('h3', {class:'ai-h3', key:key++}, line.replace('## ','')));
    } else if (line.match(/^[-•]\s/)) {
      nodes.push(h('div', {class:'ai-bullet', key:key++},
        h('span', {class:'ai-bullet-arrow'}, '▸'),
        h('span', {class:'ai-bullet-text'}, line.replace(/^[-•]\s/,''))
      ));
    } else if (line.startsWith('---')) {
      nodes.push(h('hr', {class:'ai-hr', key:key++}));
    } else if (line.startsWith('*') && line.endsWith('*')) {
      nodes.push(h('p', {class:'ai-disc', key:key++}, line.replace(/\*/g,'')));
    } else if (line.trim()) {
      nodes.push(h('p', {class:`ai-p${streaming && i===lines.length-1?' ai-cursor':''}`, key:key++}, line));
    }
  }
  return nodes;
}

// ── APP ───────────────────────────────────────────────────────────────────────
function App() {
  const [view, setView]         = useState('home');
  const [query, setQuery]       = useState('');
  const [stock, setStock]       = useState(null);
  const [sym, setSym]           = useState('');
  const [loading, setLoading]   = useState(false);
  const [errMsg, setErrMsg]     = useState('');
  const [aiText, setAiText]     = useState('');
  const [aiLoading, setAiLoading] = useState(false);
  const [aiDone, setAiDone]     = useState(false);
  const [watchlist, setWatchlist] = useState(['PETR4','VALE3','WEGE3']);
  const [perfil, setPerfil]     = useState('moderado');
  const [horizonte, setHorizonte] = useState('medio');
  const aiRef = useRef(null);
  const inputRef = useRef(null);

  function goHome() {
    setView('home'); setStock(null); setAiText(''); setAiDone(false); setErrMsg('');
  }

  function search(t) {
    const s = (t || query).toUpperCase().trim();
    if (!s) return;
    if (!STOCKS[s]) { setErrMsg(`"${s}" não encontrado. Tente: ${SUGESTOES.join(', ')}`); return; }
    setErrMsg(''); setLoading(true); setAiText(''); setAiDone(false);
    setSym(s);
    setTimeout(() => {
      setStock(STOCKS[s]); setLoading(false); setView('analysis');
      setTimeout(() => analyzeAI(STOCKS[s], s), 350);
    }, 600);
  }

  async function analyzeAI(s, symbol) {
    setAiLoading(true); setAiText(''); setAiDone(false);
    const pLabel = {conservador:'conservador (prioriza segurança)',moderado:'moderado (equilíbrio risco/retorno)',arrojado:'arrojado (aceita alta volatilidade)'}[perfil];
    const hLabel = {curto:'curto prazo (até 1 ano)',medio:'médio prazo (1 a 5 anos)',longo:'longo prazo (5+ anos)'}[horizonte];

    const prompt = `Você é um analista fundamentalista especialista em bolsa brasileira (B3).
Analise a ação ${symbol} - ${s.name} do setor ${s.sector}:

INDICADORES:
- Preço: R$ ${s.price} | Variação: ${s.pct>0?"+":""}${s.pct}%
- P/L: ${s.pl??'N/A'}x | P/VP: ${s.pvp}x | ROE: ${s.roe}%
- Dividend Yield: ${s.dy}% | Margem Líquida: ${s.margem}%
- Crescimento 5 anos: ${s.cresc}% | Dívida/EBITDA: ${s.divEbt??'N/A (setor financeiro)'}
- Governança: Nível ${s.gov} | Score: ${s.score.total}/100
- Máxima anual: R$ ${s.maxA} | Mínima anual: R$ ${s.minA}

PERFIL DO INVESTIDOR: ${pLabel}
HORIZONTE: ${hLabel}

Responda em português, estruturado EXATAMENTE assim:

## ✅ Pontos Fortes
- [ponto 1]
- [ponto 2]
- [ponto 3]

## ⚠️ Pontos de Atenção
- [risco 1]
- [risco 2]
- [risco 3]

## 📊 Adequação ao Perfil
[2 parágrafos sobre se esta ação é adequada para o perfil e horizonte informados]

## 🎯 Potencial de Valorização
[Estimativas conservadora, base e otimista com percentual e justificativa — deixar claro que são educacionais]

## 🔍 O que Monitorar
- [fator 1 que pode impactar o preço]
- [fator 2]
- [fator 3]

---
*Análise educacional. Não constitui recomendação de investimento.*`;

    try {
      const res = await fetch('https://api.anthropic.com/v1/messages', {
        method:'POST',
        headers:{'Content-Type':'application/json','x-api-key': ANTHROPIC_API_KEY,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
        body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1000,messages:[{role:'user',content:prompt}]})
      });
      const data = await res.json();
      if (data.error) throw new Error(data.error.message);
      const full = data.content?.map(b=>b.text||'').join('') || 'Erro ao processar.';
      // word-by-word streaming effect
      const words = full.split(' ');
      let i = 0;
      const tick = setInterval(() => {
        i = Math.min(i+4, words.length);
        setAiText(words.slice(0,i).join(' '));
        if (aiRef.current) aiRef.current.scrollTop = aiRef.current.scrollHeight;
        if (i >= words.length) { clearInterval(tick); setAiText(full); setAiDone(true); setAiLoading(false); }
      }, 20);
    } catch(e) {
      setAiText('⚠️ Erro ao conectar à IA: ' + (e.message||'verifique a API key e tente novamente.'));
      setAiDone(true); setAiLoading(false);
    }
  }

  function toggleWatch(s) {
    setWatchlist(w => w.includes(s) ? w.filter(x=>x!==s) : [...w,s]);
  }

  // ── HOME VIEW ────────────────────────────────────────────────────────────────
  if (view === 'home') return html`
    <div class="wrap">
      <!-- topbar -->
      <div class="topbar">
        <div class="logo">
          <div class="logo-icon">◈</div>
          <span class="logo-name">COPILOTO</span>
          <span class="badge">B3</span>
        </div>
        <div class="chip-row">
          ${['conservador','moderado','arrojado'].map(p=>html`
            <button class=${'btn-g'+(perfil===p?' active':'')} onClick=${()=>setPerfil(p)}>
              ${p.slice(0,3).toUpperCase()}
            </button>`)}
        </div>
      </div>

      <!-- hero -->
      <div class="fu" style="text-align:center;margin-bottom:32px">
        <div style="font-size:10px;color:var(--grn);letter-spacing:.15em;margin-bottom:10px">ANÁLISE FUNDAMENTALISTA · IA</div>
        <h1 style="font-family:var(--disp);font-weight:800;font-size:clamp(26px,7vw,42px);line-height:1.05;letter-spacing:-.03em;margin-bottom:12px">
          Decisões de investimento<br/>
          <span style="color:var(--grn)">mais inteligentes.</span>
        </h1>
        <p style="font-size:12px;color:var(--t2);max-width:380px;margin:0 auto;line-height:1.65">
          Digite um ticker da B3 e receba análise fundamentalista completa com IA, score de qualidade e avaliação personalizada para o seu perfil.
        </p>
      </div>

      <!-- search -->
      <div class="fu fu1" style="margin-bottom:10px">
        <div style="display:flex;gap:8px">
          <input type="text" ref=${inputRef} placeholder="Ex: PETR4, VALE3, WEGE3..."
            value=${query}
            onInput=${e=>{setQuery(e.target.value.toUpperCase());setErrMsg('')}}
            onKeyDown=${e=>e.key==='Enter'&&search()} />
          <button class="btn-p" onClick=${()=>search()} disabled=${loading}>
            ${loading ? html`<span class="spin"/>` : '↗ Analisar'}
          </button>
        </div>
        ${errMsg && html`<div style="font-size:11px;color:var(--red);margin-top:8px;padding:8px 12px;background:var(--red2);border-radius:6px">${errMsg}</div>`}
      </div>

      <!-- sugestões -->
      <div class="fu fu2" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:32px">
        ${SUGESTOES.map(t=>html`<button class="btn-g" onClick=${()=>{setQuery(t);search(t)}}>${t}</button>`)}
      </div>

      <!-- horizonte -->
      <div class="fu fu3 mb16">
        <div class="section-label">▸ HORIZONTE DE INVESTIMENTO</div>
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">
          ${[['curto','CURTO','≤1 ano'],['medio','MÉDIO','1–5 anos'],['longo','LONGO','5+ anos']].map(([v,l,s])=>html`
            <button class=${'btn-g'+(horizonte===v?' active':'')} onClick=${()=>setHorizonte(v)}
              style="padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:2px">
              <span style="font-size:9px;letter-spacing:.08em">${l}</span>
              <span style="font-size:11px">${s}</span>
            </button>`)}
        </div>
      </div>

      <!-- watchlist -->
      ${watchlist.length > 0 && html`
        <div class="fu fu4 mb16">
          <div class="section-label">▸ WATCHLIST</div>
          <div class="card flex-col" style="gap:0;overflow:hidden">
            ${watchlist.map((s,i)=>{
              const d = STOCKS[s]; if(!d) return null;
              const pos = d.pct >= 0;
              return html`
                <div class="wl-row" style=${i>0?'border-top:1px solid var(--bdr)':''} onClick=${()=>{setQuery(s);search(s)}}>
                  <div style="flex:1">
                    <div style="font-family:var(--disp);font-weight:700;font-size:14px">${s}</div>
                    <div style="font-size:10px;color:var(--t3)">${d.sector}</div>
                  </div>
                  <div style="text-align:right;margin-right:12px">
                    <div style="font-weight:600;font-size:15px">R$ ${fmt2(d.price)}</div>
                    <div class=${pos?'pos':'neg'} style="font-size:11px">${pos?'+':''}${fmt2(d.pct)}%</div>
                  </div>
                  <${ScoreRing} score=${d.score.total}/>
                </div>`;
            })}
          </div>
        </div>`}

      <!-- disclaimer -->
      <div class="fu fu5 warn">
        <div class="warn-title">⚠ AVISO REGULATÓRIO</div>
        <p class="warn-text">Este aplicativo tem fins <strong style="color:var(--t2)">educacionais e informativos</strong>. As análises geradas pela IA não constituem recomendação de investimento. Consulte sempre um assessor de investimentos certificado pela CVM antes de tomar decisões financeiras.</p>
      </div>
    </div>`;

  // ── ANALYSIS VIEW ─────────────────────────────────────────────────────────
  if (view === 'analysis' && stock) {
    const s = stock;
    const pos = s.pct >= 0;
    const inW = watchlist.includes(sym);
    const sc = s.score;
    return html`
      <div class="wrap">
        <!-- nav -->
        <div class="topbar">
          <button class="btn-g" onClick=${goHome}>← Voltar</button>
          <div style="display:flex;align-items:center;gap:8px;overflow:hidden">
            <span style="font-family:var(--disp);font-weight:800;font-size:16px">${sym}</span>
            <span style="font-size:11px;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${s.name}</span>
          </div>
          <button class=${'btn-g'+(inW?' active':'')} onClick=${()=>toggleWatch(sym)}>
            ${inW?'★':'☆'}
          </button>
        </div>

        <!-- price hero -->
        <div class="fu" style="display:flex;align-items:flex-start;gap:14px;margin-bottom:18px">
          <div style="flex:1">
            <div style="font-size:10px;color:var(--t3);letter-spacing:.07em;margin-bottom:3px">${s.sector}</div>
            <div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap">
              <span style="font-family:var(--disp);font-weight:800;font-size:34px">R$ ${fmt2(s.price)}</span>
              <span class=${pos?'pos':'neg'} style="font-size:13px">${pos?'+':''}${fmt2(s.change)} (${pos?'+':''}${fmt2(s.pct)}%)</span>
            </div>
            <div style="display:flex;gap:12px;margin-top:5px;flex-wrap:wrap">
              <span style="font-size:10px;color:var(--t3)">↓ Min ${s.minA}</span>
              <span style="font-size:10px;color:var(--t3)">↑ Máx ${s.maxA}</span>
              <span style="font-size:10px;color:var(--t3)">Vol ${s.vol}</span>
              <span style="font-size:10px;color:var(--t3)">Gov ${s.gov}</span>
            </div>
          </div>
          <${ScoreRing} score=${sc.total}/>
        </div>

        <!-- score breakdown -->
        <div class="card fu fu1 mb16" style="padding:15px">
          <div class="section-label mb8">▸ SCORE DE QUALIDADE</div>
          <${SBar} label="Lucros" val=${sc.lucro} max=25 weight=25/>
          <${SBar} label="Crescimento" val=${sc.cresc} max=25 weight=25/>
          <${SBar} label="Dívida" val=${sc.divida} max=20 weight=20/>
          <${SBar} label="Dividendos" val=${sc.divid} max=15 weight=15/>
          <${SBar} label="Governança" val=${sc.gov} max=15 weight=15/>
          <hr class="divider"/>
          <div style="display:flex;justify-content:space-between;align-items:center">
            <span style="font-size:11px;color:var(--t2)">Score Final</span>
            <span style="font-family:var(--disp);font-weight:800;font-size:21px;color:${scoreColor(sc.total)}">${sc.total}/100</span>
          </div>
        </div>

        <!-- metrics grid -->
        <div class="fu fu2 grid2 mb16">
          <${Metric} label="P/L" value=${s.pl??'—'} unit="x" color=${s.pl&&s.pl<10?'var(--grn)':s.pl&&s.pl<20?'var(--yel)':'var(--red)'} sub="Preço / Lucro"/>
          <${Metric} label="ROE" value=${s.roe} unit="%" color=${s.roe>20?'var(--grn)':s.roe>10?'var(--yel)':'var(--red)'} sub="Retorno s/ Patrimônio"/>
          <${Metric} label="Div. Yield" value=${s.dy} unit="%" color=${s.dy>8?'var(--grn)':s.dy>4?'var(--yel)':'var(--t1)'} sub="Proventos / Preço"/>
          <${Metric} label="P/VP" value=${s.pvp} unit="x" color=${s.pvp<1.5?'var(--grn)':'var(--t1)'} sub="Preço / Val. Patrimonial"/>
          <${Metric} label="Margem Liq." value=${s.margem} unit="%" color=${s.margem>25?'var(--grn)':s.margem>0?'var(--yel)':'var(--red)'} sub="Lucro / Receita"/>
          <${Metric} label="Cresc. 5a" value=${s.cresc} unit="%" color=${s.cresc>15?'var(--grn)':s.cresc>5?'var(--yel)':'var(--red)'} sub="Crescimento receita"/>
          ${s.divEbt!=null?html`<${Metric} label="Dív/EBITDA" value=${s.divEbt} unit="x" color=${s.divEbt<2?'var(--grn)':s.divEbt<3.5?'var(--yel)':'var(--red)'} sub="Alavancagem"/>`:null}
          <${Metric} label="Gov. B3" value=${s.gov} color="var(--blu)" sub="Nível de governança"/>
        </div>

        <!-- cenários -->
        <div class="fu fu3 mb16">
          <div class="section-label mb8">▸ CENÁRIOS ESTIMADOS — apenas referência educacional</div>
          <div style="display:flex;gap:8px">
            <div class="cen" style="background:var(--blu2);border:1px solid #40c4ff35">
              <div class="cen-tipo" style="color:var(--blu)">CONSERVADOR</div>
              <div class="cen-val" style="color:var(--blu)">+${Math.round(sc.total*0.08)}%</div>
              <div class="cen-sub">ao ano estimado</div>
            </div>
            <div class="cen" style="background:var(--yel2);border:1px solid #ffd74035">
              <div class="cen-tipo" style="color:var(--yel)">BASE</div>
              <div class="cen-val" style="color:var(--yel)">+${Math.round(sc.total*0.14)}%</div>
              <div class="cen-sub">ao ano estimado</div>
            </div>
            <div class="cen" style="background:var(--grn3);border:1px solid #00e67635">
              <div class="cen-tipo" style="color:var(--grn)">OTIMISTA</div>
              <div class="cen-val" style="color:var(--grn)">+${Math.round(sc.total*0.22)}%</div>
              <div class="cen-sub">ao ano estimado</div>
            </div>
          </div>
        </div>

        <!-- AI analysis -->
        <div class="fu fu4 mb16">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
            <div class="section-label" style="margin-bottom:0">▸ ANÁLISE DA IA</div>
            ${aiLoading&&html`<span class="spin" style="width:11px;height:11px"/><span style="font-size:10px;color:var(--grn)">analisando...</span>`}
            ${aiDone&&html`<span style="font-size:10px;color:var(--grn)">✓ concluído</span>`}
            <span style="margin-left:auto;font-size:10px;color:var(--t3)">Perfil: ${perfil} · ${horizonte}</span>
          </div>
          <div class="card ai-box" ref=${aiRef}>
            ${aiText
              ? renderAI(aiText, !aiDone)
              : aiLoading
                ? html`<div style="display:flex;gap:10px;align-items:center"><span class="spin"/><span style="font-size:12px;color:var(--t3)">Consultando IA, aguarde...</span></div>`
                : null}
          </div>
          ${aiDone&&html`
            <button class="btn-g mt8" style="width:100%;padding:9px;text-align:center"
              onClick=${()=>analyzeAI(s,sym)}>↺ Reanalisar</button>`}
        </div>

        <!-- disclaimer -->
        <div class="warn fu fu5">
          <div class="warn-title">⚠ AVISO</div>
          <p class="warn-text">Análise educacional gerada por IA com dados simulados. Não constitui recomendação de investimento. Consulte um assessor certificado.</p>
        </div>
      </div>`;
  }

  return null;
}

render(h(App, null), document.getElementById('app'));
</script>
</body>
</html>
