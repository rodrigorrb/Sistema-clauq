// ═══════════════════════════════════════════════════════════════
// OPFS — Origin Private File System (backup automático persistente)
// Sobrevive a limpeza de cache do navegador
// ═══════════════════════════════════════════════════════════════
const OPFS={
  get ok(){return!!navigator.storage?.getDirectory},
  async read(){
    if(!this.ok)return null;
    try{
      const root=await navigator.storage.getDirectory();
      const fh=await root.getFileHandle('clauq-data.json');
      const file=await fh.getFile();
      return JSON.parse(await file.text());
    }catch{return null;}
  },
  async write(data){
    if(!this.ok)return false;
    try{
      const root=await navigator.storage.getDirectory();
      const fh=await root.getFileHandle('clauq-data.json',{create:true});
      const ws=await fh.createWritable();
      await ws.write(JSON.stringify({...data,savedAt:new Date().toISOString()}));
      await ws.close();
      return true;
    }catch{return false;}
  }
};

// ═══════════════════════════════════════════════════════════════
// IndexedDB — banco local rápido (camada secundária)
// ═══════════════════════════════════════════════════════════════
let _idb=null;
async function getIDB(){
  if(_idb)return _idb;
  return new Promise((res,rej)=>{
    const r=indexedDB.open('clauq-db',1);
    r.onupgradeneeded=e=>e.target.result.createObjectStore('kv');
    r.onsuccess=e=>{_idb=e.target.result;res(_idb)};
    r.onerror=rej;
  });
}
const DB={
  async get(k){
    try{const db=await getIDB();return new Promise((res,rej)=>{const r=db.transaction('kv','readonly').objectStore('kv').get(k);r.onsuccess=()=>res(r.result??null);r.onerror=rej})}
    catch{try{const v=localStorage.getItem(k);return v?JSON.parse(v):null}catch{return null}}
  },
  async set(k,v){
    try{const db=await getIDB();await new Promise((res,rej)=>{const r=db.transaction('kv','readwrite').objectStore('kv').put(v,k);r.onsuccess=res;r.onerror=rej})}
    catch{}
    try{localStorage.setItem(k,JSON.stringify(v))}catch{}
  },
  // Exportar JSON para download manual
  async exportJSON(c,p,ca){
    const d={clientes:c,pedidos:p,cardapio:ca,exportedAt:new Date().toISOString()};
    dlFile(JSON.stringify(d,null,2),'clauq-backup.json','application/json');
  },
  async importJSON(file,sc,sp,sca){
    const d=JSON.parse(await file.text());
    await Promise.all([DB.set('clauq:clientes',d.clientes||[]),DB.set('clauq:pedidos',d.pedidos||[]),DB.set('clauq:cardapio',d.cardapio||[])]);
    await OPFS.write({clientes:d.clientes||[],pedidos:d.pedidos||[],cardapio:d.cardapio||[]});
    sc(d.clientes||[]);sp(d.pedidos||[]);sca(d.cardapio||[]);
  }
};

// ═══════════════════════════════════════════════════════════════
// ESC/POS
// ═══════════════════════════════════════════════════════════════
const E=0x1B,G=0x1D;
const ep={I:[E,0x40],C:[G,0x56,0x41,0x10],L:[0x0A],CE:[E,0x61,0x01],LE:[E,0x61,0x00],RI:[E,0x61,0x02],
  BO:[E,0x45,0x01],BF:[E,0x45,0x00],DO:[E,0x21,0x30],DF:[E,0x21,0x00],
  SEP:()=>Array.from('--------------------------------').map(c=>c.charCodeAt(0)),
  LN:s=>[...Array.from(s).map(c=>{const n=c.charCodeAt(0);return n>127?63:n}),0x0A]
};
function buildReceipt(lines){
  let b=[...ep.I];
  for(const l of lines){
    b.push(...(l.type==='center'?ep.CE:l.type==='right'?ep.RI:ep.LE));
    if(l.bold)b.push(...ep.BO);if(l.double)b.push(...ep.DO);
    if(l.sep)b.push(...ep.SEP(),0x0A);else b.push(...ep.LN(l.text||''));
    if(l.double)b.push(...ep.DF);if(l.bold)b.push(...ep.BF);
  }
  b.push(...ep.L,...ep.L,...ep.L,...ep.C);return new Uint8Array(b);
}
function printViaWindow(lines){
  const rows=lines.map(l=>{
    if(l.sep)return'<hr style="border:1px dashed #000;margin:3px 0"/>';
    const al=l.type==='center'?'center':l.type==='right'?'right':'left';
    const st=[l.bold&&'font-weight:700',l.double&&'font-size:16px'].filter(Boolean).join(';');
    return`<div style="text-align:${al};${st}">${l.text||'&nbsp;'}</div>`;
  }).join('');
  const w=window.open('','_blank','width=340,height=700');if(!w)return;
  w.document.write(`<!DOCTYPE html><html><head><title>Cupom ClauQ</title><style>body{font-family:monospace;font-size:11px;width:270px;margin:0 auto;padding:8px;background:#fff}@media print{@page{size:58mm auto;margin:2mm}body{width:52mm}}</style></head><body>${rows}<br/><br/><br/></body></html>`);
  w.document.close();setTimeout(()=>{try{w.print()}catch{}},400);
}

// ═══════════════════════════════════════════════════════════════
// BLUETOOTH
// ═══════════════════════════════════════════════════════════════
const BTP=[
  {service:'000018f0-0000-1000-8000-00805f9b34fb',char:'00002af1-0000-1000-8000-00805f9b34fb'},
  {service:'e7810a71-73ae-499d-8c15-faa9aef0c3f2',char:'bef8d6c9-9c21-4c9e-b632-bd58c1009f9f'},
  {service:'49535343-fe7d-4ae5-8fa9-9fafd205e455',char:'49535343-8841-43f4-a8d4-ecbe34729bb3'},
];
function usePrinter(){
  const[status,setStatus]=useState('off');
  const[name,setName]=useState(null);
  const[mode,setMode]=useState(()=>localStorage.getItem('clauq:printerMode')||'window');
  const cr=useRef(null),dr=useRef(null);
  const connect=useCallback(async()=>{
    if(!navigator.bluetooth)return{ok:false,err:'Web Bluetooth não disponível. Use o Chrome no Android.',spp:false};
    setStatus('connecting');
    try{
      const dev=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:BTP.map(p=>p.service)});
      dr.current=dev;
      dev.addEventListener('gattserverdisconnected',()=>{setStatus('off');setName(null);cr.current=null});
      const srv=await dev.gatt.connect();
      let found=null;
      for(const p of BTP){try{const s=await srv.getPrimaryService(p.service);found=await s.getCharacteristic(p.char);break}catch{}}
      if(!found){try{for(const s of await srv.getPrimaryServices()){for(const c of await s.getCharacteristics()){if(c.properties.write||c.properties.writeWithoutResponse){found=c;break}}if(found)break}}catch{}}
      if(!found){setStatus('off');return{ok:false,err:'Nenhuma característica encontrada.',spp:false}}
      cr.current=found;setName(dev.name||'Impressora BT');setStatus('on');return{ok:true};
    }catch(e){
      setStatus('off');
      const isSPP=e.message?.toLowerCase().includes('gatt')||e.name==='NetworkError'||e.name==='NotSupportedError';
      if(e.name==='NotFoundError')return{ok:false,err:'Cancelado.',spp:false};
      return{ok:false,err:isSPP?'Erro GATT: Impressora usa Bluetooth Clássico (SPP). Troque para Modo Janela nas configurações.':e.message,spp:isSPP};
    }
  },[]);
  const disconnect=useCallback(()=>{try{dr.current?.gatt?.connected&&dr.current.gatt.disconnect()}catch{}cr.current=null;setStatus('off');setName(null)},[]);
  const changeMode=useCallback((m)=>{setMode(m);localStorage.setItem('clauq:printerMode',m)},[]);
  const print=useCallback(async(data,lines)=>{
    if(mode==='window'){printViaWindow(lines);return{ok:true}}
    if(!cr.current)return{ok:false,err:'Impressora BLE não conectada.'};
    try{
      for(let i=0;i<data.length;i+=512){
        const c=data.slice(i,i+512);
        if(cr.current.properties.writeWithoutResponse)await cr.current.writeValueWithoutResponse(c);
        else await cr.current.writeValue(c);
        await new Promise(r=>setTimeout(r,60));
      }
      return{ok:true};
    }catch(e){return{ok:false,err:e.message}}
  },[mode]);
  return{status,name,mode,changeMode,connect,disconnect,print};
}

const mY=d=>{const dt=new Date(d+'T12:00:00');return`${String(dt.getMonth()+1).padStart(2,'0')}/${dt.getFullYear()}`};
const getTurno=()=>new Date().getHours()>=5&&new Date().getHours()<15?'☀️ Almoço':'🌙 Janta';
const fmtDate=d=>new Date(d+'T12:00:00').toLocaleDateString('pt-BR');
const fmtTime=iso=>{try{return new Date(iso).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}catch{return'--:--'}};
const maskPhone=v=>{const d=v.replace(/\D/g,'').slice(0,11);if(d.length<=2)return d.length===0?'':d;if(d.length<=7)return`(${d.slice(0,2)}) ${d.slice(2)}`;if(d.length<=10)return`(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`;return`(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`};
function dlFile(content,name,type){
  const blob=new Blob([typeof content==='string'?'\ufeff'+content:content],{type});
  const url=URL.createObjectURL(blob);
  const a=Object.assign(document.createElement('a'),{href:url,download:name});
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function exportCSV(pedidos,mes){
  const hdr=['#','Data','Cliente','Turno','Itens','Valor R$','Status'];
  const rows=pedidos.map((p,i)=>[i+1,p.data,p.cliente,p.turno||'',p.itens,Number(p.valor).toFixed(2),p.pago?'Pago':'Pendente']);
  const csv=[hdr,...rows].map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  dlFile(csv,`clauq-${mes.replace('/','_')}.csv`,'text/csv;charset=utf-8');
}
function getPeriodRange(period){
  const now=new Date(),end=today();
  if(period==='hoje')return{start:today(),end};
  if(period==='semana'){const s=new Date(now);s.setDate(s.getDate()-6);return{start:s.toISOString().split('T')[0],end}}
  if(period==='mes')return{start:`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-01`,end};
  return{start:'2000-01-01',end};
}

function Toast({msg,type,onDone}){
  useEffect(()=>{const t=setTimeout(onDone,3500);return()=>clearTimeout(t)},[]);
  const bg={success:'#2d6a4f',error:'#c1440e',info:'#5c4a2a',warning:'#92400e'}[type]||'#5c4a2a';
  return x`<div class="toast" style=${{background:bg}}><${Ic} n=${type==='success'?'check':'X'} s=${18} c="#fff"/>${msg}</div>`;
}
function Sheet({title,onClose,children,full}){
  useEffect(()=>{document.body.style.overflow='hidden';return()=>{document.body.style.overflow=''}},[]);
  return x`<div class="sheet-ov" onClick=${e=>{if(e.target===e.currentTarget)onClose()}}>
    <div class=${'sheet'+(full?' full':'')}>
      <div class="handle"><div class="hbar"/></div>
      <div class="stitle">
        <span style=${{fontFamily:"'DM Serif Display',serif",fontSize:'20px',color:T.tx}}>${title}</span>
        <button onClick=${onClose} style=${{background:'#f0e8df',border:'none',borderRadius:'10px',width:'34px',height:'34px',display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer'}}><${Ic} n="X" s=${18} c=${T.sub}/></button>
      </div>
      <div class="sheet-body">${children}</div>
    </div>
  </div>`;
}
const Inp=({label,...p})=>x`<div style=${{marginBottom:'14px'}}>

</div>`;
const Btn=({children,onClick,variant='primary',icon,disabled,full,small})=>{

const Card=({children,onClick,style:sx})=>x`<div class="card" style=${sx} onClick=${onClick}>${children}</div>`;

function Clientes({clientes,setClientes,toast}){
  const[sheet,setSheet]=useState(null),[busca,setBusca]=useState('');
  const[form,setForm]=useState({nome:'',telefone:'',endereco:'',obs:''});
  const save=()=>{
    if(!form.nome.trim())return toast('Informe o nome.','error');
    const list=sheet==='new'?[...clientes,{...form,id:Date.now()}]:clientes.map(c=>c.id===sheet.id?{...c,...form}:c);
    DB.set('clauq:clientes',list);setClientes(list);setSheet(null);
    toast(sheet==='new'?'Cliente cadastrado!':'Atualizado!','success');
  };
  const del=id=>{
    if(!confirm('Remover cliente?'))return;
    const list=clientes.filter(c=>c.id!==id);DB.set('clauq:clientes',list);setClientes(list);toast('Removido.','success');
  };

    <${SHead} title=${`Clientes (${clientes.length})`}/>

      <input value=${busca} onInput=${e=>setBusca(e.target.value)} placeholder="Buscar..." class="inp" style=${{paddingLeft:'42px'}}/>
    </div>
    ${fil.length===0?x`<div style=${{textAlign:'center',padding:'40px',color:T.sub}}>${busca?'Nenhum resultado.':'Cadastre o primeiro cliente!'}</div>`:x`
      <div style=${{display:'flex',flexDirection:'column',gap:'10px',paddingBottom:'80px'}}>
        ${fil.map(c=>x`<${Card}>
          <div style=${{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
            <div style=${{flex:1}}>
              <div style=${{fontWeight:700,fontSize:'16px',color:T.tx}}>${c.nome}</div>

              ${c.endereco?x`<div style=${{fontSize:'13px',color:T.sub}}>📍 ${c.endereco}</div>`:null}
            </div>
            <div style=${{display:'flex',gap:'8px'}}>
              <button onClick=${()=>{setForm({nome:c.nome,telefone:c.telefone||'',endereco:c.endereco||'',obs:c.obs||''});setSheet(c)}} style=${{background:'#f0e8df',border:'none',borderRadius:'10px',width:'36px',height:'36px',display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer'}}><${Ic} n="edit" s=${16} c=${T.sub}/></button>
              <button onClick=${()=>del(c.id)} style=${{background:'#ffe8e8',border:'none',borderRadius:'10px',width:'36px',height:'36px',display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer'}}><${Ic} n="trash" s=${16} c="#c1440e"/></button>
            </div>
          </div>
        <//>`) }
      </div>
    `}
    <${FAB} onClick=${()=>{setForm({nome:'',telefone:'',endereco:'',obs:''});setSheet('new')}} label="Novo cliente"/>
    ${sheet?x`<${Sheet} title=${sheet==='new'?'Novo Cliente':'Editar Cliente'} onClose=${()=>setSheet(null)}>
      <${Inp} label="Nome *" value=${form.nome} onInput=${e=>setForm({...form,nome:e.target.value})}/>
      <${Inp} label="Telefone" type="tel" value=${form.telefone} maxlength="15" placeholder="(11) 99999-9999" onInput=${e=>setForm({...form,telefone:maskPhone(e.target.value)})}/>
      <${Inp} label="Endereço" value=${form.endereco} onInput=${e=>setForm({...form,endereco:e.target.value})}/>

// PEDIDOS  — clienteId é estado SEPARADO do form (fix do bug)
// ═══════════════════════════════════════════════════════════════
function Pedidos({clientes,pedidos,setPedidos,cardapio,toast,printer}){
  const[filtroData,setFiltroData]=useState(today());
  const[filtroStatus,setFiltroStatus]=useState('entregar');
  const[sheet,setSheet]=useState(false);
  const[step,setStep]=useState(1);
  // ★ clienteId separado — evita stale closure no botão Continuar
  const[clienteId,setClienteId]=useState('');
  const[buscaCliente,setBuscaCliente]=useState('');
  const[form,setForm]=useState({obs:'',data:today(),pago:false,turno:getTurno()});
  const[itens,setItens]=useState([]);
  const[printing,setPrinting]=useState(null);

  const filDia=pedidos.filter(p=>!filtroData||p.data===filtroData);
  const fil=filtroStatus==='entregar'?filDia.filter(p=>!p.entregue):filDia.filter(p=>!!p.entregue);
  const nEntregar=filDia.filter(p=>!p.entregue).length;
  const nEntregues=filDia.filter(p=>!!p.entregue).length;
  const totDia=filDia.reduce((s,p)=>s+Number(p.valor),0);
  const pagosDia=filDia.filter(p=>p.pago).reduce((s,p)=>s+Number(p.valor),0);
  const btOn=printer.status==='on'||printer.mode==='window';
  const totIt=itens.reduce((s,i)=>s+i.valor*i.qtd,0);
  const cSel=clientes.find(c=>String(c.id)===clienteId);

  const reset=()=>{setSheet(false);setStep(1);setClienteId('');setBuscaCliente('');setForm({obs:'',data:today(),pago:false,turno:getTurno()});setItens([])};
  const togItem=item=>setItens(prev=>{const ex=prev.find(i=>i.id===item.id);if(ex)return prev.map(i=>i.id===item.id?{...i,qtd:i.qtd+1}:i);return[...prev,{...item,qtd:1}]});
  const setQtd=(id,q)=>{if(q<1)setItens(p=>p.filter(i=>i.id!==id));else setItens(p=>p.map(i=>i.id===id?{...i,qtd:q}:i))};

  const togglePago=async id=>{
    const list=pedidos.map(p=>p.id===id?{...p,pago:!p.pago}:p);
    await DB.set('clauq:pedidos',list);setPedidos(list);
  };
  const toggleEntregue=async id=>{
    const list=pedidos.map(p=>p.id===id?{...p,entregue:!p.entregue}:p);
    await DB.set('clauq:pedidos',list);setPedidos(list);
    toast(list.find(p=>p.id===id)?.entregue?'Marcado como entregue! ✅':'Devolvido para pendentes.','success');
  };
  const save=async()=>{
    if(!clienteId||!cSel)return toast('Selecione um cliente.','error');
    if(itens.length===0)return toast('Adicione pelo menos 1 item.','error');
    const pedido={id:Date.now(),clienteId:Number(clienteId),cliente:cSel.nome,itens:itens.map(i=>`${i.qtd}x ${i.nome}`).join(', '),itensDetalhes:itens,valor:totIt,...form,entregue:false};
    const list=[...pedidos,pedido];
    await DB.set('clauq:pedidos',list);setPedidos(list);toast('Pedido criado!','success');reset();
  };
  const del=async id=>{
    if(!confirm('Remover pedido?'))return;
    const list=pedidos.filter(p=>p.id!==id);
    await DB.set('clauq:pedidos',list);setPedidos(list);toast('Removido.','success');
  };

  const mkLines=(p,todos=false)=>{
    const hora=new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
    if(todos){
      const df=new Date((filtroData||today())+'T12:00:00').toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});
      const lines=[{type:'center',text:'SISTEMA CLAUQ',bold:true,double:true},{type:'center',text:'PEDIDOS DO DIA',bold:true},{type:'center',text:df},{sep:true}];
      filDia.forEach((pp,i)=>{lines.push({type:'left',text:`#${i+1} ${pp.cliente} ${pp.turno||''}`,bold:true});lines.push({type:'left',text:pp.itens});if(pp.obs)lines.push({type:'left',text:`Obs: ${pp.obs}`});lines.push({type:'right',text:`${fmt(pp.valor)} ${pp.pago?'[PAGO]':'[PEND]'}`});lines.push({sep:true})});
      const tD=filDia.reduce((s,p)=>s+Number(p.valor),0);const pD2=filDia.filter(p=>p.pago).reduce((s,p)=>s+Number(p.valor),0);
      lines.push({type:'right',text:`TOTAL: ${fmt(tD)}`,bold:true},{type:'right',text:`Recebido: ${fmt(pD2)}`},{type:'center',text:' '});
      return lines;
    }
    return[{type:'center',text:'SISTEMA CLAUQ',bold:true,double:true},{type:'center',text:`${fmtDate(p.data)}  ${hora}`},{type:'center',text:p.turno||''},{sep:true},{type:'left',text:`Cliente: ${p.cliente}`,bold:true},{sep:true},
      ...(p.itensDetalhes||[]).map(it=>({type:'left',text:`${it.qtd}x ${it.nome.slice(0,18).padEnd(18)} ${fmt(it.valor*it.qtd)}`})),
      {sep:true},{type:'right',text:`TOTAL: ${fmt(p.valor)}`,bold:true},{type:'center',text:p.pago?'** PAGO **':'** PENDENTE **',bold:true},
      ...(p.obs?[{type:'left',text:`Obs: ${p.obs}`}]:[]),{sep:true},{type:'center',text:'Obrigado!'},{type:'center',text:' '}];
  };
  const prt=async(p,todos=false)=>{
    setPrinting(todos?'dia':p?.id);
    const lines=mkLines(todos?null:p,todos);
    const data=buildReceipt(lines);
    const res=await printer.print(data,lines);
    toast(res.ok?(todos?`${fil.length} pedidos impressos!`:'Cupom impresso!'):'Erro: '+res.err,res.ok?'success':'error');
    setPrinting(null);
  };

  // ── Step 1: Selecionar cliente ────────────────────────────────
  const Step1=()=>x`<div>
    <p style=${{fontSize:'13px',color:T.sub,marginBottom:'16px'}}>Passo 1 de 3 — Cliente e data</p>
    <div style=${{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'12px',marginBottom:'14px'}}>
      <${Inp} label="Data" type="date" value=${form.data} onInput=${e=>setForm(f=>({...f,data:e.target.value}))}/>
      <div style=${{marginBottom:'14px'}}>
        <label class="inp-lbl">Turno</label>
        <div style=${{display:'flex',gap:'8px'}}>
          ${['☀️ Almoço','🌙 Janta'].map(t=>x`<button key=${t} onClick=${()=>setForm(f=>({...f,turno:t}))} style=${{flex:1,padding:'12px 6px',borderRadius:'12px',border:`2px solid ${form.turno===t?T.ac:T.br}`,background:form.turno===t?T.ac+'12':T.card,fontWeight:600,fontSize:'12px',cursor:'pointer',color:form.turno===t?T.ac:T.sub}}>${t}</button>`)}
        </div>
      </div>
    </div>
    <div style=${{position:'relative',marginBottom:'10px'}}>
      <div style=${{position:'absolute',left:'13px',top:'50%',transform:'translateY(-50%)',pointerEvents:'none'}}><${Ic} n="search" s=${17} c=${T.sub}/></div>
      <input
        value=${buscaCliente}
        onInput=${e=>setBuscaCliente(e.target.value)}
        placeholder="Buscar cliente..."
        class="inp"
        style=${{paddingLeft:'40px'}}
      />
    </div>
    <div style=${{display:'flex',flexDirection:'column',gap:'8px',marginBottom:'20px',maxHeight:'40vh',overflowY:'auto'}}>
      ${clientes.length===0
        ?x`<p style=${{color:T.sub,textAlign:'center',padding:'20px'}}>Cadastre clientes primeiro.</p>`
        :(()=>{
          const fil=clientes.filter(c=>c.nome.toLowerCase().includes(buscaCliente.toLowerCase())||(c.telefone||'').includes(buscaCliente));
          if(fil.length===0)return x`<p style=${{color:T.sub,textAlign:'center',padding:'16px',fontSize:'14px'}}>Nenhum cliente encontrado.</p>`;
          return fil.map(c=>x`
            <button key=${c.id} onClick=${()=>setClienteId(String(c.id))} style=${{background:clienteId===String(c.id)?T.ac+'18':T.card,border:`2px solid ${clienteId===String(c.id)?T.ac:T.br}`,borderRadius:'14px',padding:'13px 16px',display:'flex',alignItems:'center',gap:'12px',cursor:'pointer',textAlign:'left',width:'100%'}}>
              <div style=${{width:'38px',height:'38px',borderRadius:'20px',background:T.ac+'22',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,fontFamily:"'DM Serif Display',serif",fontSize:'16px',color:T.ac}}>${c.nome[0]}</div>
              <div style=${{flex:1}}>
                <div style=${{fontWeight:700,fontSize:'15px',color:T.tx}}>${c.nome}</div>
                ${c.telefone?x`<div style=${{fontSize:'12px',color:T.sub}}>${c.telefone}</div>`:null}
              </div>
              ${clienteId===String(c.id)?x`<${Ic} n="check" s=${22} c=${T.ac}/>`:null}
            </button>
          `);
        })()
      }
    </div>
    <button class="btn btn-primary btn-lg btn-full" onClick=${()=>{if(!clienteId)return toast('Selecione um cliente.','error');setStep(2)}}>Continuar →</button>
  </div>`;

  // ── Step 2: Itens ────────────────────────────────────────────
  const Step2=()=>x`<div>
    <p style=${{fontSize:'13px',color:T.sub,marginBottom:'14px'}}>Passo 2 de 3 — Itens</p>
    ${cardapio.length===0?x`<p style=${{color:T.sub,textAlign:'center',padding:'20px'}}>Configure o cardápio primeiro.</p>`:x`
      <div style=${{display:'flex',flexDirection:'column',gap:'8px',marginBottom:'16px'}}>
        ${cardapio.map(item=>{const sel=itens.find(i=>i.id===item.id);return x`

  // ── Step 3: Confirmar ────────────────────────────────────────
  const Step3=()=>x`<div>
    <p style=${{fontSize:'13px',color:T.sub,marginBottom:'14px'}}>Passo 3 de 3 — Confirmar</p>

        <button onClick=${()=>setForm(f=>({...f,pago:true}))} style=${{flex:1,padding:'12px',borderRadius:'12px',border:`2px solid ${form.pago?'#3d7a5f':T.br}`,background:form.pago?'#f0fdf4':T.card,fontWeight:700,fontSize:'14px',cursor:'pointer',color:form.pago?'#3d7a5f':T.sub}}>✅ Pago</button>

  return x`<div>

    <div style=${{display:'flex',alignItems:'center',gap:'10px',marginBottom:'12px'}}>

      ${filtroData?x`<div style=${{background:T.card,borderRadius:'12px',padding:'10px 14px',border:`1px solid ${T.br}`,flexShrink:0,minWidth:'110px'}}>
        <div style=${{fontFamily:"'DM Serif Display',serif",fontSize:'14px',color:T.ac}}>${fmt(totDia)}</div>
        <div style=${{fontSize:'10px',color:T.sub}}>${filDia.length} pedido(s)</div>
        <div style=${{fontSize:'10px',color:'#3d7a5f',fontWeight:600}}>✓ ${fmt(pagosDia)}</div>
      </div>`:null}
    </div>
    <div style=${{display:'flex',gap:'8px',marginBottom:'14px'}}>
      ${[{v:'entregar',l:'🚚 A Entregar',n:nEntregar},{v:'entregues',l:'✅ Entregues',n:nEntregues}].map(s=>x`
        <button key=${s.v} onClick=${()=>setFiltroStatus(s.v)} style=${{flex:1,padding:'10px',borderRadius:'12px',border:`2px solid ${filtroStatus===s.v?T.ac:T.br}`,background:filtroStatus===s.v?T.ac+'12':T.card,fontWeight:700,fontSize:'13px',cursor:'pointer',color:filtroStatus===s.v?T.ac:T.sub,display:'flex',alignItems:'center',justifyContent:'center',gap:'6px'}}>
          ${s.l} <span style=${{background:filtroStatus===s.v?T.ac:'#e8ddd0',color:filtroStatus===s.v?'#fff':T.sub,borderRadius:'10px',padding:'1px 7px',fontSize:'11px'}}>${s.n}</span>
        </button>
      `)}
    </div>
    ${fil.length===0?x`<div style=${{textAlign:'center',padding:'40px',color:T.sub}}>${filtroStatus==='entregar'?'Todos os pedidos entregues! ✅':'Nenhum pedido entregue hoje.'}</div>`:x`
      <div style=${{display:'flex',flexDirection:'column',gap:'10px',paddingBottom:'90px'}}>
        ${fil.map((p,i)=>x`<${Card} key=${p.id}>
          <div style=${{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
            <div style=${{flex:1}}>
              <div style=${{display:'flex',alignItems:'center',gap:'6px',marginBottom:'4px',flexWrap:'wrap'}}>
                <span style=${{background:T.ac,color:'#fff',borderRadius:'6px',padding:'2px 8px',fontSize:'11px',fontWeight:700}}>#${i+1}</span>
                <span style=${{fontWeight:700,fontSize:'15px',color:T.tx}}>${p.cliente}</span>
                ${p.turno?x`<span style=${{fontSize:'11px',color:T.sub}}>${p.turno}</span>`:null}
              </div>
              <div style=${{fontSize:'13px',color:T.sub}}>🍽 ${p.itens}</div>
              ${p.obs?x`<div style=${{fontSize:'12px',color:T.sub,fontStyle:'italic'}}>📝 ${p.obs}</div>`:null}
            </div>
            <div style=${{display:'flex',flexDirection:'column',alignItems:'flex-end',gap:'6px',flexShrink:0,marginLeft:'8px'}}>
              <div style=${{fontFamily:"'DM Serif Display',serif",fontSize:'17px',color:T.ac,fontWeight:700}}>${fmt(p.valor)}</div>
              <button class="pago-btn" onClick=${()=>togglePago(p.id)} style=${{background:p.pago?'#dcfce7':'#fff7ed',color:p.pago?'#166534':'#c2620a'}}>${p.pago?'✓ Pago':'⏳ Pendente'}</button>

            ${filtroStatus==='entregar'
              ?x`<button onClick=${()=>toggleEntregue(p.id)} style=${{background:'#f0fdf4',border:'1px solid #86efac',borderRadius:'9px',padding:'8px 12px',cursor:'pointer',display:'flex',alignItems:'center',gap:'6px',fontSize:'13px',fontWeight:700,color:'#166534'}}>🚚 Entregar</button>`
              :x`<button onClick=${()=>toggleEntregue(p.id)} style=${{background:'#f0e8df',border:'none',borderRadius:'9px',padding:'8px 12px',cursor:'pointer',display:'flex',alignItems:'center',gap:'6px',fontSize:'13px',fontWeight:600,color:T.sub}}>↩ Desfazer</button>`

        <//>`) }

    <${FAB} onClick=${()=>{setStep(1);setClienteId('');setBuscaCliente('');setForm({obs:'',data:today(),pago:false,turno:getTurno()});setItens([]);setSheet(true)}} label="Novo pedido"/>
    ${sheet?x`<${Sheet} title="Novo Pedido" onClose=${reset} full=${true}>
      ${step===1?x`<${Step1}/>`:step===2?x`<${Step2}/>`:x`<${Step3}/>`}
    <//>`:null}
  </div>`;
}

// ═══════════════════════════════════════════════════════════════
// CARDÁPIO
// ═══════════════════════════════════════════════════════════════
function Cardapio({cardapio,setCardapio,toast}){
  const[sheet,setSheet]=useState(null),[catF,setCatF]=useState('Todos');
  const[form,setForm]=useState({nome:'',descricao:'',valor:'',categoria:'Marmita'});
  const cats=['Marmita','Bebida','Sobremesa','Adicional','Outro'];
  const save=()=>{
    if(!form.nome.trim())return toast('Informe o nome.','error');
    if(!form.valor||isNaN(Number(form.valor)))return toast('Valor inválido.','error');
    const list=sheet==='new'?[...cardapio,{...form,id:Date.now(),valor:Number(form.valor)}]:cardapio.map(c=>c.id===sheet.id?{...c,...form,valor:Number(form.valor)}:c);
    DB.set('clauq:cardapio',list);setCardapio(list);setSheet(null);
    toast(sheet==='new'?'Item adicionado!':'Atualizado!','success');
  };
  const del=id=>{
    if(!confirm('Remover item?'))return;
    const list=cardapio.filter(c=>c.id!==id);DB.set('clauq:cardapio',list);setCardapio(list);toast('Removido.','success');
  };
  const shown=catF==='Todos'?cardapio:cardapio.filter(c=>c.categoria===catF);
  return x`<div>
    <${SHead} title=${`Cardápio (${cardapio.length})`}/>
    <div style=${{display:'flex',gap:'8px',overflowX:'auto',marginBottom:'16px',paddingBottom:'4px'}}>
      ${['Todos',...cats].map(cat=>x`<button key=${cat} onClick=${()=>setCatF(cat)} style=${{background:catF===cat?T.ac:'#f0e8df',color:catF===cat?'#fff':T.sub,border:'none',borderRadius:'20px',padding:'8px 16px',fontSize:'13px',fontWeight:600,cursor:'pointer',whiteSpace:'nowrap',flexShrink:0}}>${cat}</button>`)}
    </div>
    ${shown.length===0?x`<div style=${{textAlign:'center',padding:'40px',color:T.sub}}>Nenhum item. Adicione!</div>`:x`
      <div style=${{display:'flex',flexDirection:'column',gap:'10px',paddingBottom:'90px'}}>
        ${shown.map(item=>x`<${Card} key=${item.id}>
          <div style=${{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
            <div style=${{flex:1}}>
              <div style=${{fontWeight:700,fontSize:'16px',color:T.tx}}>${item.nome}</div>
              ${item.descricao?x`<div style=${{fontSize:'13px',color:T.sub,marginTop:'2px'}}>${item.descricao}</div>`:null}
              <span style=${{display:'inline-block',background:'#f0e8df',color:T.sub,borderRadius:'6px',padding:'2px 8px',fontSize:'11px',fontWeight:600,marginTop:'6px'}}>${item.categoria}</span>
            </div>
            <div style=${{fontFamily:"'DM Serif Display',serif",fontSize:'20px',color:T.ac,fontWeight:700,marginLeft:'10px'}}>${fmt(item.valor)}</div>
          </div>
          <div style=${{display:'flex',gap:'8px',marginTop:'10px'}}>
            <button onClick=${()=>{setForm({nome:item.nome,descricao:item.descricao||'',valor:String(item.valor),categoria:item.categoria||'Marmita'});setSheet(item)}} style=${{background:'#f0e8df',border:'none',borderRadius:'9px',padding:'8px 14px',cursor:'pointer',display:'flex',alignItems:'center',gap:'6px',fontSize:'13px',fontWeight:600,color:T.sub}}><${Ic} n="edit" s=${14} c=${T.sub}/>Editar</button>
            <button onClick=${()=>del(item.id)} style=${{background:'#ffe8e8',border:'none',borderRadius:'9px',padding:'8px 14px',cursor:'pointer',display:'flex',alignItems:'center',gap:'6px',fontSize:'13px',fontWeight:600,color:'#c1440e'}}><${Ic} n="trash" s=${14} c="#c1440e"/>Remover</button>
          </div>
        <//>`) }
      </div>
    `}
    <${FAB} onClick=${()=>{setForm({nome:'',descricao:'',valor:'',categoria:'Marmita'});setSheet('new')}} label="Novo item"/>
    ${sheet?x`<${Sheet} title=${sheet==='new'?'Novo Item':'Editar Item'} onClose=${()=>setSheet(null)}>
      <${Inp} label="Nome *" value=${form.nome} onInput=${e=>setForm({...form,nome:e.target.value})}/>
      <${Inp} label="Descrição" value=${form.descricao} onInput=${e=>setForm({...form,descricao:e.target.value})}/>
      <${Inp} label="Valor (R$) *" type="number" min="0" step="0.01" value=${form.valor} onInput=${e=>setForm({...form,valor:e.target.value})}/>
      <div style=${{marginBottom:'14px'}}>
        <label class="inp-lbl">Categoria</label>
        <div style=${{display:'flex',flexWrap:'wrap',gap:'8px'}}>
          ${cats.map(c=>x`<button key=${c} onClick=${()=>setForm({...form,categoria:c})} style=${{background:form.categoria===c?T.ac:'#f0e8df',color:form.categoria===c?'#fff':T.sub,border:'none',borderRadius:'20px',padding:'9px 18px',fontSize:'14px',fontWeight:600,cursor:'pointer'}}>${c}</button>`)}
        </div>
      </div>
      <div style=${{display:'flex',gap:'10px',marginTop:'8px'}}>
        <${Btn} variant="ghost" onClick=${()=>setSheet(null)} full=${true}>Cancelar<//>
        <${Btn} onClick=${save} full=${true}>${sheet==='new'?'Adicionar':'Salvar'}<//>
      </div>
    <//>`:null}
  </div>`;
}

// ═══════════════════════════════════════════════════════════════
// RELATÓRIO
// ═══════════════════════════════════════════════════════════════
function Relatorio({pedidos,setPedidos,printer,toast}){
  const ma=mY(today()),ms=[...new Set(pedidos.map(p=>mY(p.data)))].sort().reverse();
  const[mes,setMes]=useState(ma),[tab,setTab]=useState('mensal');
  const[dvPeriodo,setDvPeriodo]=useState('mes'),[printing,setPrinting]=useState(false);

  const lista=pedidos.filter(p=>mY(p.data)===mes),total=lista.reduce((s,p)=>s+Number(p.valor),0);
  const pagos=lista.filter(p=>p.pago).reduce((s,p)=>s+Number(p.valor),0);
  const pend=lista.filter(p=>!p.pago).reduce((s,p)=>s+Number(p.valor),0);
  const pD={};lista.forEach(p=>{pD[p.data]=(pD[p.data]||0)+Number(p.valor)});
  const dias=Object.keys(pD).sort(),mx=Math.max(...Object.values(pD),1);
  const pC={};lista.forEach(p=>{pC[p.cliente]=(pC[p.cliente]||0)+Number(p.valor)});
  const topCli=Object.entries(pC).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const pI={};lista.forEach(p=>{(p.itens||'').split(', ').forEach(it=>{const m=it.match(/(\d+)x (.+)/);if(m)pI[m[2]]=(pI[m[2]]||0)+Number(m[1])})});
  const topItm=Object.entries(pI).sort((a,b)=>b[1]-a[1]).slice(0,5);

  const{start,end}=getPeriodRange(dvPeriodo);
  const pedsDev=pedidos.filter(p=>!p.pago&&p.data>=start&&p.data<=end);
  const devedores=Object.values(pedsDev.reduce((acc,p)=>{
    if(!acc[p.clienteId])acc[p.clienteId]={nome:p.cliente,pedidos:[],total:0};
    acc[p.clienteId].pedidos.push(p);acc[p.clienteId].total+=Number(p.valor);return acc;
  },{})).sort((a,b)=>b.total-a.total);
  const totalDev=devedores.reduce((s,d)=>s+d.total,0);

  const marcarPago=async id=>{const list=pedidos.map(p=>p.id===id?{...p,pago:true}:p);await DB.set('clauq:pedidos',list);setPedidos(list);toast('Marcado como pago!','success')};
  const prtDevedores=()=>{
    const periodoLabel={hoje:'Hoje',semana:'Esta semana',mes:'Este mês',geral:'Geral'}[dvPeriodo];
    const lines=[
      {type:'center',text:'SISTEMA CLAUQ',bold:true,double:true},
      {type:'center',text:'RELATORIO DE DEVEDORES',bold:true},
      {type:'center',text:periodoLabel},{sep:true},
    ];
    devedores.forEach(d=>{
      lines.push({type:'left',text:d.nome,bold:true});
      d.pedidos.forEach(p=>{lines.push({type:'left',text:`${fmtDate(p.data)} ${p.turno||''}`});lines.push({type:'left',text:p.itens});lines.push({type:'right',text:fmt(p.valor)})});
      lines.push({type:'right',text:`Subtotal: ${fmt(d.total)}`,bold:true});lines.push({sep:true});
    });
    lines.push({type:'right',text:`TOTAL DEVEDOR: ${fmt(totalDev)}`,bold:true,double:true});
    lines.push({type:'center',text:`${devedores.length} cliente(s) | ${pedsDev.length} pedido(s)`});
    lines.push({type:'center',text:' '});
    const data=buildReceipt(lines);
    printer.print(data,lines).then(res=>toast(res.ok?'Relatório impresso!':'Erro: '+res.err,res.ok?'success':'error'));
  };
  const marcarTodos=async ids=>{const s=new Set(ids);const list=pedidos.map(p=>s.has(p.id)?{...p,pago:true}:p);await DB.set('clauq:pedidos',list);setPedidos(list);toast('Quitado!','success')};
  const btOn=printer.status==='on'||printer.mode==='window';

  const prtT=async()=>{
    setPrinting(true);
    const[m,a]=mes.split('/'),nm=new Date(`${a}-${m}-01`).toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
    const lines=[{type:'center',text:'SISTEMA CLAUQ',bold:true,double:true},{type:'center',text:'RELATORIO MENSAL',bold:true},{type:'center',text:nm.toUpperCase()},{sep:true},
      {type:'left',text:`Pedidos: ${lista.length}`},{type:'left',text:`Faturamento: ${fmt(total)}`,bold:true},
      {type:'left',text:`Recebido:  ${fmt(pagos)}`},{type:'left',text:`Pendente:  ${fmt(pend)}`},
      {sep:true},{type:'left',text:'TOP CLIENTES:',bold:true},...topCli.map(([n,v],i)=>({type:'left',text:`${i+1}. ${n.slice(0,14).padEnd(14)} ${fmt(v)}`})),
      {sep:true},{type:'left',text:'MAIS PEDIDOS:',bold:true},...topItm.map(([n,q],i)=>({type:'left',text:`${i+1}. ${n.slice(0,18).padEnd(18)} ${q}x`})),
      {sep:true},{type:'center',text:'Sistema ClauQ'},{type:'center',text:' '}];
    const data=buildReceipt(lines);const res=await printer.print(data,lines);
    toast(res.ok?'Relatório impresso!':'Erro: '+res.err,res.ok?'success':'error');setPrinting(false);
  };

  return x`<div>
    <div style=${{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'14px',gap:'10px',flexWrap:'wrap'}}>
      <h2 style=${{margin:0,fontFamily:"'DM Serif Display',serif",fontSize:'20px',color:T.tx}}>Relatório</h2>
      ${tab==='mensal'?x`<select value=${mes} onChange=${e=>setMes(e.target.value)} class="inp" style=${{width:'auto',padding:'8px 12px'}}>${ms.length===0?x`<option value=${ma}>${ma}</option>`:ms.map(m=>x`<option key=${m}>${m}</option>`)}</select>`:null}
    </div>
    <div class="tab">
      ${[{v:'mensal',l:'📊 Mensal'},{v:'devedores',l:'⚠️ Devedores'}].map(t=>x`
        <button key=${t.v} class=${`tab-btn${tab===t.v?' active':''}`} onClick=${()=>setTab(t.v)}>${t.l}</button>
      `)}
    </div>
    ${tab==='mensal'?x`<div>
      ${lista.length===0?x`<div style=${{textAlign:'center',padding:'40px',color:T.sub}}>Nenhum pedido neste mês.</div>`:x`
        <div style=${{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'10px',marginBottom:'16px'}}>
          ${[{lb:'Pedidos',v:lista.length,co:'#3d7a5f'},{lb:'Faturamento',v:fmt(total),co:T.ac},{lb:'✓ Recebido',v:fmt(pagos),co:'#3d7a5f'},{lb:'⏳ Pendente',v:fmt(pend),co:'#c2620a'}].map(m=>x`
            <${Card} style=${{padding:'14px 16px'}}><div style=${{fontFamily:"'DM Serif Display',serif",fontSize:m.v.toString().length>7?'13px':'18px',color:m.co,fontWeight:700}}>${m.v}</div><div style=${{fontSize:'12px',color:T.sub,marginTop:'3px'}}>${m.lb}</div><//>
          `)}
        </div>
        ${dias.length>0?x`<${Card} style=${{marginBottom:'14px',padding:'16px'}}>
          <div style=${{fontWeight:700,fontSize:'14px',color:T.tx,marginBottom:'12px'}}>Faturamento por dia</div>
          <div style=${{display:'flex',alignItems:'flex-end',gap:'4px',height:'70px',overflowX:'auto'}}>
            ${dias.map(dia=>{const v=pD[dia],h=Math.max(6,(v/mx)*60);return x`
              <div key=${dia} style=${{flex:1,minWidth:'20px',display:'flex',flexDirection:'column',alignItems:'center',gap:'3px'}}>
                <div style=${{width:'100%',height:`${h}px`,background:T.ac,borderRadius:'4px 4px 0 0'}}/>
                <div style=${{fontSize:'8px',color:T.sub}}>${dia.slice(8)}</div>
              </div>
            `})}
          </div>
        <//>`:null}
        ${topCli.length>0?x`<${Card} style=${{marginBottom:'10px'}}>
          <div style=${{fontWeight:700,fontSize:'14px',color:T.tx,marginBottom:'10px'}}>🏆 Top Clientes</div>
          ${topCli.map(([nome,val],i)=>x`<div key=${nome} style=${{display:'flex',justifyContent:'space-between',padding:'7px 0',borderBottom:i<topCli.length-1?`1px solid ${T.br}`:'none'}}><span style=${{fontSize:'14px',color:T.tx}}>${['🥇','🥈','🥉'][i]||`${i+1}.`} ${nome}</span><span style=${{fontFamily:"'DM Serif Display',serif",fontSize:'14px',color:T.ac}}>${fmt(val)}</span></div>`)}
        <//>`:null}
        ${topItm.length>0?x`<${Card} style=${{marginBottom:'10px'}}>
          <div style=${{fontWeight:700,fontSize:'14px',color:T.tx,marginBottom:'10px'}}>🍽 Mais pedidos</div>
          ${topItm.map(([nome,qtd],i)=>x`<div key=${nome} style=${{display:'flex',justifyContent:'space-between',padding:'7px 0',borderBottom:i<topItm.length-1?`1px solid ${T.br}`:'none'}}><span style=${{fontSize:'14px',color:T.tx}}>${i+1}. ${nome}</span><span style=${{fontSize:'13px',color:T.ac,fontWeight:700}}>${qtd}x</span></div>`)}
        <//>`:null}
        <div style=${{display:'flex',gap:'10px',marginBottom:'80px',marginTop:'4px'}}>
          <${Btn} full=${true} variant="ghost" icon="download" onClick=${()=>exportCSV(lista,mes)}>Exportar CSV<//>
          ${btOn?x`<${Btn} full=${true} variant="green" icon="print" onClick=${prtT} disabled=${printing}>${printing?'...':'🖨 Imprimir'}<//>`:null}
        </div>
      `}
    </div>`:null}
    ${tab==='devedores'?x`<div>
      <div style=${{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'12px',gap:'10px'}}>
        <div style=${{display:'flex',gap:'8px',overflowX:'auto',paddingBottom:'4px',flex:1}}>
          ${[{v:'hoje',l:'Hoje'},{v:'semana',l:'Semana'},{v:'mes',l:'Este mês'},{v:'geral',l:'Geral'}].map(p=>x`
          <button key=${p.v} onClick=${()=>setDvPeriodo(p.v)} style=${{background:dvPeriodo===p.v?T.ac:'#f0e8df',color:dvPeriodo===p.v?'#fff':T.sub,border:'none',borderRadius:'20px',padding:'8px 18px',fontSize:'13px',fontWeight:600,cursor:'pointer',whiteSpace:'nowrap',flexShrink:0}}>${p.l}</button>
        `)}
        </div>
        ${devedores.length>0?x`<${Btn} small=${true} variant=${btOn?'green':'ghost'} icon="print" onClick=${prtDevedores}>🖨<//>`:null}
      </div>
      ${devedores.length===0?x`<div style=${{textAlign:'center',padding:'40px',color:T.sub}}>✅ Nenhum devedor neste período!</div>`:x`
        <${Card} style=${{marginBottom:'14px',background:'#fff7ed',border:'1px solid #fed7aa'}}>
          <div style=${{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
            <div><div style=${{fontWeight:700,fontSize:'14px',color:'#c2620a'}}>${devedores.length} cliente(s) com pendências</div><div style=${{fontSize:'12px',color:'#9a3412'}}>${pedsDev.length} pedido(s) não pagos</div></div>
            <div style=${{fontFamily:"'DM Serif Display',serif",fontSize:'20px',color:'#c2620a',fontWeight:700}}>${fmt(totalDev)}</div>
          </div>
        <//>
        <div style=${{display:'flex',flexDirection:'column',gap:'12px',paddingBottom:'80px'}}>
          ${devedores.map(d=>x`<${Card} key=${d.nome}>
            <div style=${{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'10px'}}>
              <div><div style=${{fontWeight:700,fontSize:'16px',color:T.tx}}>${d.nome}</div><div style=${{fontSize:'12px',color:T.sub}}>${d.pedidos.length} pedido(s) em aberto</div></div>
              <div style=${{textAlign:'right'}}>
                <div style=${{fontFamily:"'DM Serif Display',serif",fontSize:'18px',color:'#c2620a',fontWeight:700}}>${fmt(d.total)}</div>
                <button onClick=${()=>marcarTodos(d.pedidos.map(p=>p.id))} style=${{background:'#dcfce7',color:'#166534',border:'none',borderRadius:'8px',padding:'4px 10px',fontSize:'11px',fontWeight:700,cursor:'pointer',marginTop:'4px'}}>✓ Quitar tudo</button>
              </div>
            </div>
            <div style=${{borderTop:`1px solid ${T.br}`,paddingTop:'10px'}}>
              ${d.pedidos.map(p=>x`<div key=${p.id} style=${{display:'flex',justifyContent:'space-between',alignItems:'flex-start',padding:'8px 0',borderBottom:`1px dashed ${T.br}`}}>
                <div style=${{flex:1}}>
                  <div style=${{fontSize:'13px',color:T.tx,fontWeight:600}}>${fmtDate(p.data)} ${p.turno||''}</div>
                  <div style=${{fontSize:'12px',color:T.sub}}>${p.itens}</div>
                  ${p.obs?x`<div style=${{fontSize:'11px',color:T.sub,fontStyle:'italic'}}>${p.obs}</div>`:null}
                </div>
                <div style=${{display:'flex',flexDirection:'column',alignItems:'flex-end',gap:'4px',marginLeft:'10px'}}>
                  <span style=${{fontWeight:700,fontSize:'14px',color:'#c2620a'}}>${fmt(p.valor)}</span>
                  <button onClick=${()=>marcarPago(p.id)} style=${{background:'#dcfce7',color:'#166534',border:'none',borderRadius:'7px',padding:'3px 9px',fontSize:'11px',fontWeight:700,cursor:'pointer'}}>✓ Pago</button>
                </div>
              </div>`)}
            </div>
          <//>`) }
        </div>
      `}
    </div>`:null}
  </div>`;
}

// ═══════════════════════════════════════════════════════════════
// CONFIGURAÇÕES — Impressora + Backup automático
// ═══════════════════════════════════════════════════════════════
function Configuracoes({printer,toast,clientes,pedidos,cardapio,setCli,setPed,setCa,backupInfo,setBackupInterval}){
  const{status,name,mode,changeMode,connect,disconnect}=printer;
  const[loading,setLoading]=useState(false),[err,setErr]=useState(null),[sppWarn,setSppWarn]=useState(false);
  const fileRef=useRef(null);
  const co={on:'#3d7a5f',connecting:'#a05a20',off:'#8a6a50',error:'#c1440e'}[status];
  const lb={on:`Conectado: ${name}`,connecting:'Conectando...',off:'Desconectado',error:'Erro'}[status];
  const INTERVALS=[{v:1,l:'1 minuto'},{v:5,l:'5 minutos'},{v:10,l:'10 minutos'},{v:30,l:'30 minutos'},{v:0,l:'Manual'}];

  const hConn=async()=>{
    setLoading(true);setErr(null);setSppWarn(false);
    const res=await connect();
    if(!res.ok){setErr(res.err);if(res.spp)setSppWarn(true)}
    setLoading(false);
  };
  const doImport=async e=>{
    const file=e.target.files[0];if(!file)return;
    try{await DB.importJSON(file,setCli,setPed,setCa);toast('Dados importados!','success')}
    catch{toast('Erro ao importar.','error')}
    e.target.value='';
  };
  const doForceBackup=async()=>{
    const ok=await OPFS.write({clientes,pedidos,cardapio});
    toast(ok?'Backup salvo no dispositivo!':'Erro no backup (OPFS não suportado).',ok?'success':'error');
  };

  return x`<div style=${{paddingBottom:'20px'}}>
    <${SHead} title="Configurações"/>

    <h3 style=${{fontFamily:"'DM Serif Display',serif",fontSize:'17px',color:T.tx,marginBottom:'12px'}}>🖨 Impressora</h3>
    <div class="tab" style=${{marginBottom:'16px'}}>
      ${[{v:'ble',l:'📶 Bluetooth BLE'},{v:'window',l:'🖥 Modo Janela'}].map(m=>x`
        <button key=${m.v} class=${`tab-btn${mode===m.v?' active':''}`} onClick=${()=>{changeMode(m.v);setErr(null);setSppWarn(false)}}>${m.l}</button>
      `)}
    </div>
    ${mode==='window'?x`<div class="info-box" style=${{marginBottom:'16px'}}>
      <strong>Modo Janela</strong> — Ideal para impressoras SPP (Bluetooth Clássico com PIN).<br/>
      No Android: toque em <strong>Mais opções → Selecionar impressora</strong> na janela de impressão.
    </div>`:x`<div>
      <${Card} style=${{marginBottom:'14px'}}>
        <div style=${{display:'flex',alignItems:'center',gap:'14px'}}>
          <div style=${{width:'48px',height:'48px',borderRadius:'14px',background:co+'18',display:'flex',alignItems:'center',justifyContent:'center'}}><${Ic} n=${status==='on'?'wifi':'nobt'} s=${24} c=${co}/></div>
          <div><div style=${{fontWeight:700,fontSize:'16px',color:T.tx}}>Bluetooth BLE</div><div style=${{fontSize:'13px',color:co,marginTop:'2px'}}>${lb}</div></div>
        </div>
      <//>
      ${err?x`<div class="err-box" style=${{marginBottom:'12px'}}>${err}</div>`:null}
      ${sppWarn?x`<div class="info-box" style=${{marginBottom:'12px'}}>Troque para <strong>Modo Janela</strong> acima para usar sua impressora SPP.</div>`:null}
      <div style=${{marginBottom:'20px'}}>${status==='on'?x`<${Btn} full=${true} variant="danger" icon="nobt" onClick=${disconnect}>Desconectar<//>`:x`<${Btn} full=${true} variant="green" icon="wifi" onClick=${hConn} disabled=${loading||status==='connecting'}>${loading||status==='connecting'?'Procurando...':'Conectar BLE'}<//>` }</div>
    </div>`}

    <div class="sep"/>
    <h3 style=${{fontFamily:"'DM Serif Display',serif",fontSize:'17px',color:T.tx,marginBottom:'4px'}}>💾 Backup Automático</h3>
    <p style=${{fontSize:'12px',color:T.sub,marginBottom:'14px'}}>Os dados são salvos automaticamente no dispositivo (OPFS), independente do cache do navegador.</p>

    <${Card} style=${{marginBottom:'16px'}}>
      <div style=${{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'10px'}}>
        <div style=${{display:'flex',alignItems:'center',gap:'8px'}}>
          <${Ic} n="shield" s=${18} c=${OPFS.ok?'#3d7a5f':'#c2620a'}/>
          <span style=${{fontWeight:600,fontSize:'14px',color:T.tx}}>OPFS ${OPFS.ok?'✅ Suportado':'⚠️ Indisponível'}</span>
        </div>
        ${backupInfo.saving?x`<div class="saving-dot" style=${{background:'#3d7a5f'}}/>`:null}
      </div>
      <div style=${{fontSize:'12px',color:T.sub,marginBottom:'8px'}}>Último backup: <strong>${backupInfo.lastSave||'Nunca'}</strong></div>
      <div style=${{fontSize:'12px',color:T.sub}}>Próximo em: <strong>${backupInfo.nextIn||'--'}</strong></div>
    <//>

    <div style=${{marginBottom:'16px'}}>
      <label class="inp-lbl">Intervalo de backup automático</label>
      <div style=${{display:'flex',flexWrap:'wrap',gap:'8px'}}>
        ${INTERVALS.map(iv=>x`
          <button key=${iv.v} onClick=${()=>setBackupInterval(iv.v)} style=${{background:backupInfo.interval===iv.v?T.ac:'#f0e8df',color:backupInfo.interval===iv.v?'#fff':T.sub,border:'none',borderRadius:'20px',padding:'9px 16px',fontSize:'13px',fontWeight:600,cursor:'pointer'}}>${iv.l}</button>
        `)}
      </div>
    </div>

    <div style=${{display:'flex',gap:'10px',marginBottom:'10px'}}>
      <${Btn} full=${true} variant="green" icon="shield" onClick=${doForceBackup}>Salvar backup agora<//>
    </div>

    <div class="sep"/>
    <h3 style=${{fontFamily:"'DM Serif Display',serif",fontSize:'17px',color:T.tx,marginBottom:'12px'}}>📤 Exportar / Importar</h3>
    <p style=${{fontSize:'12px',color:T.sub,marginBottom:'14px'}}>Para transferir dados entre dispositivos ou como cópia extra de segurança.</p>
    <div style=${{display:'flex',flexDirection:'column',gap:'10px',paddingBottom:'20px'}}>
      <${Btn} full=${true} variant="ghost" icon="download" onClick=${()=>DB.exportJSON(clientes,pedidos,cardapio)}>⬇️ Exportar JSON<//>
      <button onClick=${()=>fileRef.current?.click()} class="btn btn-ghost btn-lg btn-full"><${Ic} n="upload" s=${17} c=${T.sub}/>⬆️ Importar JSON</button>
      <input ref=${fileRef} type="file" accept=".json" style=${{display:'none'}} onChange=${doImport}/>
    </div>
  </div>`;
}

// ═══════════════════════════════════════════════════════════════
// APP ROOT
// ═══════════════════════════════════════════════════════════════
function App(){
  const[screen,setScreen]=useState('home');
  const[clientes,setClientes]=useState([]);
  const[pedidos,setPedidos]=useState([]);
  const[cardapio,setCardapio]=useState([]);
  const[toast,setToast]=useState(null);
  const[loading,setLoading]=useState(true);
  const[backupInfo,setBackupInfo]=useState({lastSave:null,interval:5,saving:false,nextIn:null});
  const timerRef=useRef(null);
  const printer=usePrinter();
  const showToast=(msg,type='success')=>setToast({msg,type,id:Date.now()});

  // ── Carregamento inicial: OPFS → IndexedDB → localStorage ───
  useEffect(()=>{
    (async()=>{
      let data=await OPFS.read();
      if(data?.clientes){
        setClientes(data.clientes||[]);setPedidos(data.pedidos||[]);setCardapio(data.cardapio||[]);
        if(data.savedAt)setBackupInfo(b=>({...b,lastSave:fmtTime(data.savedAt)}));
      }else{
        const[c,p,ca]=await Promise.all([DB.get('clauq:clientes'),DB.get('clauq:pedidos'),DB.get('clauq:cardapio')]);
        setClientes(c||[]);setPedidos(p||[]);setCardapio(ca||[]);
        // Criar primeiro backup OPFS imediatamente
        if(OPFS.ok)OPFS.write({clientes:c||[],pedidos:p||[],cardapio:ca||[]}).then(ok=>{if(ok)setBackupInfo(b=>({...b,lastSave:fmtTime(new Date().toISOString())}))});
      }
      const savedInterval=parseInt(localStorage.getItem('clauq:backupInterval')||'5');
      setBackupInfo(b=>({...b,interval:savedInterval}));
      setLoading(false);
    })();
  },[]);

  // ── Backup automático periódico ──────────────────────────────
  const setBackupInterval=useCallback(mins=>{
    setBackupInfo(b=>({...b,interval:mins}));
    localStorage.setItem('clauq:backupInterval',String(mins));
  },[]);

  useEffect(()=>{
    if(timerRef.current)clearInterval(timerRef.current);
    if(loading||backupInfo.interval===0)return;
    const mins=backupInfo.interval;
    let nextTs=Date.now()+mins*60000;
    const tick=async()=>{
      setBackupInfo(b=>({...b,saving:true}));
      const data={clientes,pedidos,cardapio};
      // Salva em IndexedDB (sempre)
      await Promise.all([DB.set('clauq:clientes',clientes),DB.set('clauq:pedidos',pedidos),DB.set('clauq:cardapio',cardapio)]);
      // Salva em OPFS
      const ok=await OPFS.write(data);
      const now=fmtTime(new Date().toISOString());
      nextTs=Date.now()+mins*60000;
      setBackupInfo(b=>({...b,saving:false,lastSave:ok?now:b.lastSave}));
    };
    timerRef.current=setInterval(tick,mins*60000);
    // Atualiza contador de próximo backup
    const counter=setInterval(()=>{
      const remaining=Math.max(0,Math.ceil((nextTs-Date.now())/60000));
      setBackupInfo(b=>({...b,nextIn:remaining<=1?'<1 min':`${remaining} min`}));
    },30000);
    setBackupInfo(b=>({...b,nextIn:`${mins} min`}));
    return()=>{clearInterval(timerRef.current);clearInterval(counter)};
  },[backupInfo.interval,loading,clientes,pedidos,cardapio]);

  // ── Salvar no IndexedDB a cada mudança de dados ──────────────
  useEffect(()=>{if(!loading){DB.set('clauq:clientes',clientes)}},[clientes,loading]);
  useEffect(()=>{if(!loading){DB.set('clauq:pedidos',pedidos)}},[pedidos,loading]);
  useEffect(()=>{if(!loading){DB.set('clauq:cardapio',cardapio)}},[cardapio,loading]);

  const NAV=[{id:'home',lb:'Início',ic:'home'},{id:'clientes',lb:'Clientes',ic:'users'},{id:'pedidos',lb:'Pedidos',ic:'cart'},{id:'cardapio',lb:'Cardápio',ic:'menu'},{id:'relatorio',lb:'Relatório',ic:'chart'}];
  const btOn=printer.status==='on',isWin=printer.mode==='window';

  if(loading)return x`<div style=${{height:'100%',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',background:T.hdr,gap:'12px'}}>
    <span style=${{fontSize:'52px'}}>🍱</span>
    <span style=${{fontFamily:"'DM Serif Display',serif",fontSize:'24px',color:'#fdf0df'}}>Sistema ClauQ</span>
    <span style=${{fontSize:'13px',color:'#c8a070'}}>Carregando...</span>
  </div>`;

  return x`<div style=${{display:'flex',flexDirection:'column',height:'100%'}}>
    <header style=${{background:T.hdr,padding:'10px 16px',display:'flex',alignItems:'center',justifyContent:'space-between',flexShrink:0}}>
      <div style=${{display:'flex',alignItems:'center',gap:'10px'}}>
        <span style=${{fontSize:'20px'}}>🍱</span>
        <div>
          <div style=${{fontFamily:"'DM Serif Display',serif",color:'#fdf0df',fontSize:'17px',lineHeight:1.1}}>Sistema ClauQ</div>
          ${screen!=='home'?x`<div style=${{fontSize:'10px',color:'#c8a070'}}>${NAV.find(n=>n.id===screen)?.lb||'Configurações'}</div>`:null}
        </div>
      </div>
      <div style=${{display:'flex',alignItems:'center',gap:'8px'}}>
        ${backupInfo.saving?x`<div style=${{fontSize:'10px',color:'#4ade80',display:'flex',alignItems:'center',gap:'4px'}}><div class="saving-dot" style=${{background:'#4ade80',width:'6px',height:'6px'}}/>Salvando</div>`:backupInfo.lastSave?x`<div style=${{fontSize:'10px',color:'#c8a070'}}>💾 ${backupInfo.lastSave}</div>`:null}
        <button onClick=${()=>setScreen(screen==='config'?'home':'config')} style=${{background:btOn?'#0f3321':isWin?'#0f2240':'rgba(255,255,255,.1)',border:'none',borderRadius:'20px',padding:'6px 12px',display:'flex',alignItems:'center',gap:'5px',cursor:'pointer'}}>
          ${btOn?x`<${Ic} n="wifi" s=${14} c="#4ade80"/>`:isWin?x`<${Ic} n="print" s=${14} c="#60a5fa"/>`:x`<${Ic} n="settings" s=${14} c="#c8a070"/>`}
          <span style=${{fontSize:'10px',color:btOn?'#4ade80':isWin?'#60a5fa':'#c8a070'}}>${btOn?printer.name?.split(' ')[0]||'BT':isWin?'Janela':'Config'}</span>
        </button>
      </div>
    </header>
    <main style=${{flex:1,padding:'16px 16px 0',overflowY:'auto'}}>
      ${screen==='home'?x`<${Home} clientes=${clientes} pedidos=${pedidos} setScreen=${setScreen}/>`:null}
      ${screen==='clientes'?x`<${Clientes} clientes=${clientes} setClientes=${setClientes} toast=${showToast}/>`:null}
      ${screen==='pedidos'?x`<${Pedidos} clientes=${clientes} pedidos=${pedidos} setPedidos=${setPedidos} cardapio=${cardapio} toast=${showToast} printer=${printer}/>`:null}
      ${screen==='cardapio'?x`<${Cardapio} cardapio=${cardapio} setCardapio=${setCardapio} toast=${showToast}/>`:null}
      ${screen==='relatorio'?x`<${Relatorio} pedidos=${pedidos} setPedidos=${setPedidos} printer=${printer} toast=${showToast}/>`:null}
      ${screen==='config'?x`<${Configuracoes} printer=${printer} toast=${showToast} clientes=${clientes} pedidos=${pedidos} cardapio=${cardapio} setCli=${setClientes} setPed=${setPedidos} setCa=${setCardapio} backupInfo=${backupInfo} setBackupInterval=${setBackupInterval}/>`:null}
    </main>
    <nav class="nav">
      ${NAV.map(n=>{const active=screen===n.id;return x`
        <button key=${n.id} class="nav-btn" onClick=${()=>setScreen(n.id)}>
          <div class="nav-ic" style=${{background:active?T.ac+'18':'transparent'}}><${Ic} n=${n.ic} s=${20} c=${active?T.ac:T.sub} sw=${active?2.5:2}/></div>
          <span style=${{fontSize:'10px',fontWeight:active?700:500,color:active?T.ac:T.sub}}>${n.lb}</span>
        </button>
      `})}
    </nav>
    ${toast?x`<${Toast} key=${toast.id} msg=${toast.msg} type=${toast.type} onDone=${()=>setToast(null)}/>`:null}
  </div>`;
}

render(x`<${App}/>`,document.getElementById('app'));
</script>
</body>
</html>
