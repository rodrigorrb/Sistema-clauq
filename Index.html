<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>

<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:#1c0f00;font-family:'DM Sans',sans-serif}
  #root{height:100dvh;display:flex;flex-direction:column;max-width:480px;margin:0 auto;background:#faf5ee;overflow:hidden}

  ::-webkit-scrollbar{display:none}

  @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}

<body>
<div id="root"></div>
<script type="text/babel">
const{useState,useEffect,useRef,useCallback}=React;

// ── Storage ──────────────────────────────────────────────────────────────────
const DB={
  get:k=>{try{const v=localStorage.getItem(k);return Promise.resolve(v?JSON.parse(v):null)}catch{return Promise.resolve(null)}},
  set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}return Promise.resolve()},
};

// ── ESC/POS ──────────────────────────────────────────────────────────────────
const ESC=0x1B,GS=0x1D;
const ep={
  INIT:[ESC,0x40],CUT:[GS,0x56,0x41,0x10],LF:[0x0A],
  CENTER:[ESC,0x61,0x01],LEFT:[ESC,0x61,0x00],RIGHT:[ESC,0x61,0x02],
  BON:[ESC,0x45,0x01],BOFF:[ESC,0x45,0x00],DON:[ESC,0x21,0x30],DOFF:[ESC,0x21,0x00],
  SEP:()=>Array.from("--------------------------------").map(c=>c.charCodeAt(0)),
  LINE:s=>[...Array.from(s).map(c=>{const n=c.charCodeAt(0);return n>127?63:n}),0x0A],
};
function buildReceipt(lines){
  let b=[...ep.INIT];
  for(const l of lines){
    b.push(...(l.type==="center"?ep.CENTER:l.type==="right"?ep.RIGHT:ep.LEFT));
    if(l.bold)b.push(...ep.BON);if(l.double)b.push(...ep.DON);
    if(l.sep)b.push(...ep.SEP(),0x0A);else b.push(...ep.LINE(l.text||""));
    if(l.double)b.push(...ep.DOFF);if(l.bold)b.push(...ep.BOFF);
  }
  b.push(...ep.LF,...ep.LF,...ep.LF,...ep.CUT);
  return new Uint8Array(b);
}

// ── Bluetooth ─────────────────────────────────────────────────────────────────
const BT_PROFILES=[
  {service:"000018f0-0000-1000-8000-00805f9b34fb",char:"00002af1-0000-1000-8000-00805f9b34fb"},
  {service:"e7810a71-73ae-499d-8c15-faa9aef0c3f2",char:"bef8d6c9-9c21-4c9e-b632-bd58c1009f9f"},
  {service:"49535343-fe7d-4ae5-8fa9-9fafd205e455",char:"49535343-8841-43f4-a8d4-ecbe34729bb3"},
];
function usePrinter(){
  const[status,setStatus]=useState("off");
  const[name,setName]=useState(null);
  const charRef=useRef(null),devRef=useRef(null);
  const connect=useCallback(async()=>{
    if(!navigator.bluetooth)return{ok:false,err:"Use o Chrome no Android para Bluetooth."};
    setStatus("connecting");
    try{
      const dev=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:BT_PROFILES.map(p=>p.service)});
      devRef.current=dev;
      dev.addEventListener("gattserverdisconnected",()=>{setStatus("off");setName(null);charRef.current=null;});
      const srv=await dev.gatt.connect();
      let found=null;
      for(const p of BT_PROFILES){try{const s=await srv.getPrimaryService(p.service);found=await s.getCharacteristic(p.char);break}catch{}}
      if(!found){try{for(const s of await srv.getPrimaryServices()){for(const c of await s.getCharacteristics()){if(c.properties.write||c.properties.writeWithoutResponse){found=c;break}}if(found)break}}catch{}}
      if(!found){setStatus("off");return{ok:false,err:"Impressora não reconhecida."};}
      charRef.current=found;setName(dev.name||"Impressora BT");setStatus("on");return{ok:true};
    }catch(e){setStatus("off");return{ok:false,err:e.name==="NotFoundError"?"Cancelado.":e.message};}
  },[]);
  const disconnect=useCallback(()=>{devRef.current?.gatt?.connected&&devRef.current.gatt.disconnect();charRef.current=null;setStatus("off");setName(null);},[]);
  const print=useCallback(async(data)=>{
    if(!charRef.current)return{ok:false,err:"Impressora desconectada."};
    try{
      for(let i=0;i<data.length;i+=512){
        const c=data.slice(i,i+512);
        if(charRef.current.properties.writeWithoutResponse)await charRef.current.writeValueWithoutResponse(c);
        else await charRef.current.writeValue(c);
        await new Promise(r=>setTimeout(r,60));
      }
      return{ok:true};
    }catch(e){return{ok:false,err:e.message};}
  },[]);
  return{status,name,connect,disconnect,print};
}

// ── Helpers ───────────────────────────────────────────────────────────────────
const fmt=v=>Number(v).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const today=()=>new Date().toISOString().split("T")[0];
const monthYear=d=>{const dt=new Date(d+"T12:00:00");return`${String(dt.getMonth()+1).padStart(2,"0")}/${dt.getFullYear()}`};

// ── Theme ─────────────────────────────────────────────────────────────────────
const T={bg:"#faf5ee",card:"#ffffff",header:"#1c0f00",accent:"#d4522a",accent2:"#3d7a5f",text:"#1c0f00",sub:"#8a6a50",border:"#e8ddd0",inp:"#fdf8f3"};

// ── Icons ─────────────────────────────────────────────────────────────────────
const P={
  home:"M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6",
  users:"M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z",
  cart:"M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z",
  menu:"M4 6h16M4 12h16M4 18h16",chart:"M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z",
  print:"M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z",
  plus:"M12 4v16m8-8H4",trash:"M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16",
  edit:"M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z",
  check:"M5 13l4 4L19 7",x:"M6 18L18 6M6 6l12 12",
  star:"M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z",
  wifi:"M8.111 16.404a5.5 5.5 0 017.778 0M12 20h.01m-7.08-7.071c3.904-3.905 10.236-3.905 14.143 0M1.394 9.393c5.857-5.857 15.355-5.857 21.213 0",
  nobt:"M18.364 5.636a9 9 0 010 12.728m-3.536-3.536a5 5 0 000-7.072m-7.072 7.072a5 5 0 010-7.072M5.636 5.636a9 9 0 000 12.728",
  search:"M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z",
};
const Ic=({n,s=22,c="currentColor",sw=2})=>(
  <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth={sw} strokeLinecap="round" strokeLinejoin="round">
    <path d={P[n]}/>
  </svg>
);

// ── UI Components ─────────────────────────────────────────────────────────────
function Toast({msg,type,onDone}){
  useEffect(()=>{const t=setTimeout(onDone,3200);return()=>clearTimeout(t)},[]);
  const bg={success:"#2d6a4f",error:"#c1440e",info:"#5c4a2a"}[type]||"#5c4a2a";
  return(
    <div style={{position:"fixed",bottom:82,left:12,right:12,background:bg,color:"#fff",padding:"13px 16px",borderRadius:14,display:"flex",alignItems:"center",gap:10,zIndex:9999,boxShadow:"0 6px 24px rgba(0,0,0,.25)",fontFamily:"'DM Sans',sans-serif",fontSize:14,fontWeight:500}}>
      <Ic n={type==="success"?"check":"x"} s={18} c="#fff"/>{msg}
    </div>
  );
}

function Sheet({title,onClose,children,full}){
  useEffect(()=>{document.body.style.overflow="hidden";return()=>{document.body.style.overflow=""}},[]);
  return(
    <div style={{position:"fixed",inset:0,zIndex:500,display:"flex",flexDirection:"column",justifyContent:"flex-end"}}>
      <div onClick={onClose} style={{position:"absolute",inset:0,background:"rgba(28,15,0,.55)"}}/>
      <div style={{position:"relative",background:T.bg,borderRadius:"20px 20px 0 0",maxHeight:full?"97vh":"92vh",display:"flex",flexDirection:"column",animation:"slideUp .25s ease-out"}}>
        <div style={{display:"flex",justifyContent:"center",padding:"12px 0 0"}}>
          <div style={{width:40,height:4,borderRadius:2,background:T.border}}/>
        </div>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 20px 14px"}}>
          <span style={{fontFamily:"'DM Serif Display',serif",fontSize:20,color:T.text}}>{title}</span>
          <button onClick={onClose} style={{background:"#f0e8df",border:"none",borderRadius:10,width:34,height:34,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer"}}>
            <Ic n="x" s={18} c={T.sub}/>
          </button>
        </div>
        <div style={{overflowY:"auto",padding:"0 20px 48px",flex:1}}>{children}</div>
      </div>
    </div>
  );
}

const inpStyle={width:"100%",padding:"13px 15px",borderRadius:12,border:`1.5px solid ${T.border}`,background:T.inp,fontSize:15,color:T.text,outline:"none",boxSizing:"border-box"};
function Inp({label,...props}){
  return(
    <div style={{marginBottom:14}}>
      {label&&<label style={{display:"block",fontSize:12,fontWeight:600,color:T.sub,marginBottom:6,textTransform:"uppercase",letterSpacing:.5}}>{label}</label>}
      {props.as==="textarea"
        ?<textarea {...props} as={undefined} style={{...inpStyle,minHeight:80,resize:"vertical",...props.style}}/>
        :<input {...props} style={{...inpStyle,...props.style}}/>}
    </div>
  );
}

function Btn({children,onClick,variant="primary",icon,disabled,full,small}){
  const v={primary:{bg:T.accent,color:"#fff",shadow:"0 4px 14px rgba(212,82,42,.35)"},green:{bg:T.accent2,color:"#fff",shadow:"0 4px 14px rgba(61,122,95,.3)"},ghost:{bg:"#f0e8df",color:T.sub,shadow:"none"},danger:{bg:"#7f1d1d",color:"#fff",shadow:"none"}}[variant]||{};
  return(
    <button disabled={disabled} onClick={onClick} style={{background:v.bg,color:v.color,border:"none",borderRadius:13,padding:small?"9px 16px":"14px 22px",fontSize:small?13:15,fontWeight:700,display:"inline-flex",alignItems:"center",gap:8,cursor:disabled?"not-allowed":"pointer",opacity:disabled?.5:1,width:full?"100%":undefined,justifyContent:"center",boxShadow:v.shadow}}>
      {icon&&<Ic n={icon} s={small?15:18} c={v.color}/>}{children}
    </button>
  );
}

const Card=({children,onClick,style:sx})=>(
  <div onClick={onClick} style={{background:T.card,borderRadius:16,padding:"15px 16px",boxShadow:"0 2px 16px rgba(28,15,0,.08)",border:`1px solid ${T.border}`,cursor:onClick?"pointer":undefined,...sx}}>
    {children}
  </div>
);

const FAB=({onClick,label})=>(
  <button onClick={onClick} style={{position:"fixed",bottom:76,right:16,background:T.accent,color:"#fff",border:"none",borderRadius:20,padding:"13px 18px",fontWeight:700,fontSize:15,display:"flex",alignItems:"center",gap:8,boxShadow:"0 6px 24px rgba(212,82,42,.45)",cursor:"pointer",zIndex:200}}>
    <Ic n="plus" s={20} c="#fff"/>{label}
  </button>
);

const SHead=({title,right})=>(
  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
    <h2 style={{margin:0,fontFamily:"'DM Serif Display',serif",fontSize:20,color:T.text}}>{title}</h2>
    {right}
  </div>
);

// ── HOME ──────────────────────────────────────────────────────────────────────
function Home({clientes,pedidos,setScreen}){
  const tStr=today(),hoje=pedidos.filter(p=>p.data===tStr);
  const tHoje=hoje.reduce((s,p)=>s+Number(p.valor),0);
  const mes=monthYear(tStr),meses=pedidos.filter(p=>monthYear(p.data)===mes);
  const tMes=meses.reduce((s,p)=>s+Number(p.valor),0);
  const dl=new Date().toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long"});
  return(
    <div>
      <div style={{background:`linear-gradient(135deg,${T.header} 0%,#3d1a00 100%)`,margin:"-20px -16px 20px",padding:"28px 20px 24px",borderRadius:"0 0 24px 24px"}}>
        <p style={{margin:"0 0 4px",fontSize:13,color:"#c8a070",textTransform:"capitalize"}}>{dl}</p>
        <h1 style={{margin:0,fontFamily:"'DM Serif Display',serif",fontSize:26,color:"#fdf0df"}}>Bom dia! 🍱</h1>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:20}}>
        {[{icon:"users",label:"Clientes",value:clientes.length,color:"#3d7a5f"},{icon:"cart",label:"Pedidos hoje",value:hoje.length,color:T.accent},{icon:"star",label:"Hoje",value:fmt(tHoje),color:"#a05a20"},{icon:"chart",label:"Este mês",value:fmt(tMes),color:"#5c3d8a"}].map(m=>(
          <Card key={m.label} style={{padding:"16px"}}>
            <div style={{width:36,height:36,borderRadius:10,background:m.color+"18",display:"flex",alignItems:"center",justifyContent:"center",marginBottom:10}}>
              <Ic n={m.icon} s={18} c={m.color}/>
            </div>
            <div style={{fontFamily:"'DM Serif Display',serif",fontSize:m.value.toString().length>7?16:20,color:T.text,fontWeight:700,lineHeight:1.2}}>{m.value}</div>
            <div style={{fontSize:12,color:T.sub,marginTop:3}}>{m.label}</div>
          </Card>
        ))}
      </div>
      <SHead title="Acesso rápido"/>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:20}}>
        {[{icon:"cart",label:"Novo Pedido",screen:"pedidos",color:T.accent},{icon:"users",label:"Clientes",screen:"clientes",color:"#3d7a5f"},{icon:"menu",label:"Cardápio",screen:"cardapio",color:"#a05a20"},{icon:"chart",label:"Relatório",screen:"relatorio",color:"#5c3d8a"}].map(a=>(
          <button key={a.label} onClick={()=>setScreen(a.screen)} style={{background:T.card,border:`1px solid ${T.border}`,borderRadius:14,padding:"14px",display:"flex",alignItems:"center",gap:10,cursor:"pointer",boxShadow:"0 2px 16px rgba(28,15,0,.08)"}}>
            <div style={{width:38,height:38,borderRadius:10,background:a.color+"18",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}><Ic n={a.icon} s={19} c={a.color}/></div>
            <span style={{fontSize:13,fontWeight:700,color:T.text}}>{a.label}</span>
          </button>
        ))}
      </div>
      {hoje.length>0&&(
        <>
          <SHead title="Hoje" right={<button onClick={()=>setScreen("pedidos")} style={{background:"none",border:"none",color:T.accent,fontSize:13,fontWeight:700,cursor:"pointer"}}>Ver todos</button>}/>
          <div style={{display:"flex",flexDirection:"column",gap:8,paddingBottom:80}}>
            {hoje.slice(-4).reverse().map(p=>(
              <Card key={p.id}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                  <div><div style={{fontWeight:700,fontSize:15,color:T.text}}>{p.cliente}</div><div style={{fontSize:12,color:T.sub,marginTop:2}}>{p.itens}</div></div>
                  <div style={{fontFamily:"'DM Serif Display',serif",fontSize:17,color:T.accent,fontWeight:700}}>{fmt(p.valor)}</div>
                </div>
              </Card>
            ))}
          </div>
        </>
      )}
    </div>
  );
}

// ── CLIENTES ──────────────────────────────────────────────────────────────────
function Clientes({clientes,setClientes,toast}){
  const[sheet,setSheet]=useState(null),[busca,setBusca]=useState("");
  const[form,setForm]=useState({nome:"",telefone:"",endereco:"",obs:""});
  const openNew=()=>{setForm({nome:"",telefone:"",endereco:"",obs:""});setSheet("new")};
  const openEdit=c=>{setForm({nome:c.nome,telefone:c.telefone||"",endereco:c.endereco||"",obs:c.obs||""});setSheet(c)};
  const save=async()=>{
    if(!form.nome.trim())return toast("Informe o nome.","error");
    const list=sheet==="new"?[...clientes,{...form,id:Date.now()}]:clientes.map(c=>c.id===sheet.id?{...c,...form}:c);
    await DB.set("clauq:clientes",list);setClientes(list);setSheet(null);
    toast(sheet==="new"?"Cliente cadastrado!":"Atualizado!","success");
  };
  const del=async id=>{
    if(!confirm("Remover cliente?"))return;
    const list=clientes.filter(c=>c.id!==id);
    await DB.set("clauq:clientes",list);setClientes(list);toast("Removido.","success");
  };
  const filtered=clientes.filter(c=>c.nome.toLowerCase().includes(busca.toLowerCase())||(c.telefone||"").includes(busca));
  return(
    <>
      <SHead title={`Clientes (${clientes.length})`}/>
      <div style={{position:"relative",marginBottom:16}}>
        <div style={{position:"absolute",left:13,top:"50%",transform:"translateY(-50%)"}}><Ic n="search" s={18} c={T.sub}/></div>
        <input value={busca} onChange={e=>setBusca(e.target.value)} placeholder="Buscar..." style={{...inpStyle,paddingLeft:42}}/>
      </div>
      {filtered.length===0
        ?<div style={{textAlign:"center",padding:40,color:T.sub}}>{busca?"Nenhum resultado.":"Cadastre o primeiro cliente!"}</div>
        :<div style={{display:"flex",flexDirection:"column",gap:10,paddingBottom:80}}>
          {filtered.map(c=>(
            <Card key={c.id}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                <div style={{flex:1}}>
                  <div style={{fontWeight:700,fontSize:16,color:T.text}}>{c.nome}</div>
                  {c.telefone&&<div style={{fontSize:13,color:T.sub,marginTop:2}}>📞 {c.telefone}</div>}
                  {c.endereco&&<div style={{fontSize:13,color:T.sub}}>📍 {c.endereco}</div>}
                </div>
                <div style={{display:"flex",gap:8}}>
                  <button onClick={()=>openEdit(c)} style={{background:"#f0e8df",border:"none",borderRadius:10,width:36,height:36,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer"}}><Ic n="edit" s={16} c={T.sub}/></button>
                  <button onClick={()=>del(c.id)} style={{background:"#ffe8e8",border:"none",borderRadius:10,width:36,height:36,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer"}}><Ic n="trash" s={16} c="#c1440e"/></button>
                </div>
              </div>
            </Card>
          ))}
        </div>
      }
      <FAB onClick={openNew} label="Novo cliente"/>
      {sheet&&(
        <Sheet title={sheet==="new"?"Novo Cliente":"Editar Cliente"} onClose={()=>setSheet(null)}>
          <Inp label="Nome *" value={form.nome} onChange={e=>setForm({...form,nome:e.target.value})}/>
          <Inp label="Telefone" type="tel" value={form.telefone} onChange={e=>setForm({...form,telefone:e.target.value})}/>
          <Inp label="Endereço" value={form.endereco} onChange={e=>setForm({...form,endereco:e.target.value})}/>
          <Inp label="Observações" as="textarea" value={form.obs} onChange={e=>setForm({...form,obs:e.target.value})}/>
          <div style={{display:"flex",gap:10,marginTop:8}}>
            <Btn variant="ghost" onClick={()=>setSheet(null)} full>Cancelar</Btn>
            <Btn onClick={save} full>{sheet==="new"?"Cadastrar":"Salvar"}</Btn>
          </div>
        </Sheet>
      )}
    </>
  );
}

// ── PEDIDOS ───────────────────────────────────────────────────────────────────
function Pedidos({clientes,pedidos,setPedidos,cardapio,toast,printer}){
  const[filtroData,setFiltroData]=useState(today()),[sheet,setSheet]=useState(false),[step,setStep]=useState(1);
  const[form,setForm]=useState({clienteId:"",obs:"",data:today()}),[itens,setItens]=useState([]),[printing,setPrinting]=useState(null);
  const filtered=pedidos.filter(p=>!filtroData||p.data===filtroData);
  const totalDia=filtered.reduce((s,p)=>s+Number(p.valor),0);
  const btOn=printer.status==="on",valorTotal=itens.reduce((s,i)=>s+i.valor*i.qtd,0);
  const clienteSel=clientes.find(c=>c.id===Number(form.clienteId));
  const reset=()=>{setSheet(false);setStep(1);setForm({clienteId:"",obs:"",data:today()});setItens([])};
  const toggleItem=item=>setItens(prev=>{const ex=prev.find(i=>i.id===item.id);if(ex)return prev.map(i=>i.id===item.id?{...i,qtd:i.qtd+1}:i);return[...prev,{...item,qtd:1}]});
  const setQtd=(id,q)=>{if(q<1)setItens(p=>p.filter(i=>i.id!==id));else setItens(p=>p.map(i=>i.id===id?{...i,qtd:q}:i))};
  const save=async()=>{
    if(!form.clienteId)return toast("Selecione um cliente.","error");
    if(itens.length===0)return toast("Adicione pelo menos 1 item.","error");
    const pedido={id:Date.now(),clienteId:Number(form.clienteId),cliente:clienteSel.nome,itens:itens.map(i=>`${i.qtd}x ${i.nome}`).join(", "),itensDetalhes:itens,valor:valorTotal,obs:form.obs,data:form.data};
    const list=[...pedidos,pedido];
    await DB.set("clauq:pedidos",list);setPedidos(list);toast("Pedido criado!","success");reset();
  };
  const del=async id=>{
    if(!confirm("Remover pedido?"))return;
    const list=pedidos.filter(p=>p.id!==id);
    await DB.set("clauq:pedidos",list);setPedidos(list);toast("Removido.","success");
  };
  const printPedido=async p=>{
    setPrinting(p.id);
    const hora=new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
    const data=buildReceipt([
      {type:"center",text:"SISTEMA CLAUQ",bold:true,double:true},
      {type:"center",text:`${new Date(p.data+"T12:00:00").toLocaleDateString("pt-BR")}  ${hora}`},
      {sep:true},{type:"left",text:`Cliente: ${p.cliente}`,bold:true},{sep:true},
      ...(p.itensDetalhes||[]).map(it=>({type:"left",text:`${it.qtd}x ${it.nome.slice(0,20).padEnd(20)} ${fmt(it.valor*it.qtd)}`})),
      {sep:true},{type:"right",text:`TOTAL: ${fmt(p.valor)}`,bold:true},
      ...(p.obs?[{type:"left",text:`Obs: ${p.obs}`}]:[]),
      {type:"center",text:"Obrigado!"},{type:"center",text:" "},
    ]);
    const res=await printer.print(data);
    toast(res.ok?"Cupom impresso!":"Erro: "+res.err,res.ok?"success":"error");setPrinting(null);
  };
  const printDia=async()=>{
    if(filtered.length===0)return toast("Nenhum pedido nesta data.","error");
    setPrinting("dia");
    const df=new Date((filtroData||today())+"T12:00:00").toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long"});
    const lines=[{type:"center",text:"SISTEMA CLAUQ",bold:true,double:true},{type:"center",text:"PEDIDOS DO DIA",bold:true},{type:"center",text:df},{sep:true}];
    filtered.forEach((p,i)=>{lines.push({type:"left",text:`#${i+1} ${p.cliente}`,bold:true});lines.push({type:"left",text:p.itens});if(p.obs)lines.push({type:"left",text:`Obs: ${p.obs}`});lines.push({type:"right",text:fmt(p.valor)});lines.push({sep:true})});
    lines.push({type:"right",text:`TOTAL: ${fmt(totalDia)}`,bold:true},{type:"center",text:" "});
    const res=await printer.print(buildReceipt(lines));
    toast(res.ok?`${filtered.length} pedidos impressos!`:"Erro: "+res.err,res.ok?"success":"error");setPrinting(null);
  };
  const printNav=()=>{
    const df=new Date((filtroData||today())+"T12:00:00").toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
    const w=window.open("","_blank");
    w.document.write(`<html><head><title>Pedidos</title><style>body{font-family:Georgia,serif;padding:20px}table{width:100%;border-collapse:collapse}th{background:#f5e6d3;padding:8px;text-align:left;font-size:12px}td{padding:8px;border-bottom:1px solid #eee;font-size:12px}.tot{font-weight:bold;text-align:right;margin-top:12px;border-top:2px solid #c1440e;padding-top:8px}</style></head><body><h2>🍱 Sistema ClauQ</h2><p>${df}</p><table><thead><tr><th>#</th><th>Cliente</th><th>Itens</th><th>Valor</th></tr></thead><tbody>${filtered.map((p,i)=>`<tr><td>${i+1}</td><td>${p.cliente}</td><td>${p.itens}</td><td>R$ ${Number(p.valor).toFixed(2)}</td></tr>`).join("")}</tbody></table><p class="tot">Total: R$ ${totalDia.toFixed(2)}</p><script>window.print()<\/script></body></html>`);
    w.document.close();
  };
  const renderStep=()=>{
    if(step===1)return(
      <>
        <p style={{fontSize:13,color:T.sub,marginBottom:14}}>Passo 1 de 3 — Selecione o cliente</p>
        <Inp label="Data" type="date" value={form.data} onChange={e=>setForm({...form,data:e.target.value})}/>
        <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:16}}>
          {clientes.length===0?<p style={{color:T.sub,textAlign:"center",padding:20}}>Cadastre clientes primeiro.</p>
            :clientes.map(c=>(
              <button key={c.id} onClick={()=>setForm({...form,clienteId:String(c.id)})} style={{background:form.clienteId===String(c.id)?T.accent+"18":T.card,border:`2px solid ${form.clienteId===String(c.id)?T.accent:T.border}`,borderRadius:14,padding:"13px 16px",display:"flex",alignItems:"center",gap:12,cursor:"pointer",textAlign:"left"}}>
                <div style={{width:38,height:38,borderRadius:20,background:T.accent+"22",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                  <span style={{fontFamily:"'DM Serif Display',serif",fontSize:16,color:T.accent}}>{c.nome[0]}</span>
                </div>
                <div><div style={{fontWeight:700,fontSize:15,color:T.text}}>{c.nome}</div>{c.telefone&&<div style={{fontSize:12,color:T.sub}}>{c.telefone}</div>}</div>
                {form.clienteId===String(c.id)&&<div style={{marginLeft:"auto"}}><Ic n="check" s={20} c={T.accent}/></div>}
              </button>
            ))
          }
        </div>
        <Btn full onClick={()=>{if(!form.clienteId)return toast("Selecione um cliente.","error");setStep(2)}}>Continuar →</Btn>
      </>
    );
    if(step===2)return(
      <>
        <p style={{fontSize:13,color:T.sub,marginBottom:14}}>Passo 2 de 3 — Escolha os itens</p>
        {cardapio.length===0?<p style={{color:T.sub,textAlign:"center",padding:20}}>Configure o cardápio primeiro.</p>
          :<div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:16}}>
            {cardapio.map(item=>{
              const sel=itens.find(i=>i.id===item.id);
              return(
                <div key={item.id} style={{background:sel?T.accent+"10":T.card,border:`2px solid ${sel?T.accent:T.border}`,borderRadius:14,padding:"13px 16px",display:"flex",alignItems:"center",gap:12}}>
                  <button onClick={()=>toggleItem(item)} style={{flex:1,background:"none",border:"none",cursor:"pointer",textAlign:"left",padding:0}}>
                    <div style={{fontWeight:700,fontSize:15,color:T.text}}>{item.nome}</div>
                    <div style={{fontFamily:"'DM Serif Display',serif",fontSize:15,color:T.accent}}>{fmt(item.valor)}</div>
                  </button>
                  {sel?(
                    <div style={{display:"flex",alignItems:"center",gap:8,flexShrink:0}}>
                      <button onClick={()=>setQtd(sel.id,sel.qtd-1)} style={{width:32,height:32,borderRadius:8,background:"#f0e8df",border:"none",cursor:"pointer",fontSize:20,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:700}}>−</button>
                      <span style={{fontWeight:700,fontSize:16,color:T.accent,minWidth:22,textAlign:"center"}}>{sel.qtd}</span>
                      <button onClick={()=>setQtd(sel.id,sel.qtd+1)} style={{width:32,height:32,borderRadius:8,background:T.accent,border:"none",cursor:"pointer",fontSize:20,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:700,color:"#fff"}}>+</button>
                    </div>
                  ):(
                    <button onClick={()=>toggleItem(item)} style={{width:34,height:34,borderRadius:10,background:T.accent,border:"none",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                      <Ic n="plus" s={18} c="#fff"/>
                    </button>
                  )}
                </div>
              );
            })}
          </div>
        }
        {itens.length>0&&(
          <div style={{background:T.accent+"12",borderRadius:14,padding:"12px 16px",marginBottom:16}}>
            {itens.map(it=><div key={it.id} style={{display:"flex",justifyContent:"space-between",fontSize:13,color:T.sub,marginBottom:4}}><span>{it.qtd}x {it.nome}</span><span>{fmt(it.valor*it.qtd)}</span></div>)}
            <div style={{display:"flex",justifyContent:"space-between",fontFamily:"'DM Serif Display',serif",fontSize:18,color:T.accent,marginTop:8,paddingTop:8,borderTop:`1px solid ${T.border}`}}><span>Total</span><span>{fmt(valorTotal)}</span></div>
          </div>
        )}
        <div style={{display:"flex",gap:10}}><Btn variant="ghost" onClick={()=>setStep(1)} full>← Voltar</Btn><Btn onClick={()=>{if(itens.length===0)return toast("Adicione itens.","error");setStep(3)}} full>Continuar →</Btn></div>
      </>
    );
    if(step===3)return(
      <>
        <p style={{fontSize:13,color:T.sub,marginBottom:14}}>Passo 3 de 3 — Confirmar</p>
        <Card style={{marginBottom:12}}><div style={{fontSize:12,color:T.sub,fontWeight:600,textTransform:"uppercase",letterSpacing:.5,marginBottom:6}}>Cliente</div><div style={{fontWeight:700,fontSize:16,color:T.text}}>{clienteSel?.nome}</div></Card>
        <Card style={{marginBottom:12}}>
          <div style={{fontSize:12,color:T.sub,fontWeight:600,textTransform:"uppercase",letterSpacing:.5,marginBottom:8}}>Itens</div>
          {itens.map(it=><div key={it.id} style={{display:"flex",justifyContent:"space-between",fontSize:14,color:T.text,marginBottom:5}}><span>{it.qtd}x {it.nome}</span><span style={{color:T.accent,fontWeight:700}}>{fmt(it.valor*it.qtd)}</span></div>)}
          <div style={{display:"flex",justifyContent:"space-between",fontFamily:"'DM Serif Display',serif",fontSize:20,color:T.accent,marginTop:10,paddingTop:10,borderTop:`1px solid ${T.border}`}}><span>Total</span><span>{fmt(valorTotal)}</span></div>
        </Card>
        <Inp label="Observações (opcional)" value={form.obs} onChange={e=>setForm({...form,obs:e.target.value})}/>
        <div style={{display:"flex",gap:10,marginTop:4}}><Btn variant="ghost" onClick={()=>setStep(2)} full>← Itens</Btn><Btn onClick={save} full>✓ Criar pedido</Btn></div>
      </>
    );
  };
  return(
    <>
      <SHead title="Pedidos" right={btOn?<Btn small variant="green" icon="print" onClick={printDia} disabled={printing==="dia"}>{printing==="dia"?"...":"Imprimir dia"}</Btn>:<Btn small variant="ghost" icon="print" onClick={printNav}>Imprimir</Btn>}/>
      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:16}}>
        <input type="date" value={filtroData} onChange={e=>setFiltroData(e.target.value)} style={{flex:1,...inpStyle}}/>
        {filtroData&&<div style={{background:T.card,borderRadius:12,padding:"10px 14px",border:`1px solid ${T.border}`,flexShrink:0}}><div style={{fontFamily:"'DM Serif Display',serif",fontSize:15,color:T.accent}}>{fmt(totalDia)}</div><div style={{fontSize:11,color:T.sub}}>{filtered.length} pedido(s)</div></div>}
      </div>
      {filtered.length===0?<div style={{textAlign:"center",padding:40,color:T.sub}}>Nenhum pedido nesta data.</div>
        :<div style={{display:"flex",flexDirection:"column",gap:10,paddingBottom:90}}>
          {filtered.map((p,i)=>(
            <Card key={p.id}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                <div style={{flex:1}}>
                  <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:4}}>
                    <span style={{background:T.accent,color:"#fff",borderRadius:6,padding:"2px 8px",fontSize:11,fontWeight:700}}>#{i+1}</span>
                    <span style={{fontWeight:700,fontSize:15,color:T.text}}>{p.cliente}</span>
                  </div>
                  <div style={{fontSize:13,color:T.sub}}>🍽 {p.itens}</div>
                  {p.obs&&<div style={{fontSize:12,color:T.sub,fontStyle:"italic"}}>📝 {p.obs}</div>}
                </div>
                <div style={{fontFamily:"'DM Serif Display',serif",fontSize:18,color:T.accent,fontWeight:700,flexShrink:0,marginLeft:8}}>{fmt(p.valor)}</div>
              </div>
              <div style={{display:"flex",gap:8,marginTop:12}}>
                {btOn&&<Btn small variant="green" icon="print" onClick={()=>printPedido(p)} disabled={printing===p.id}>Cupom</Btn>}
                <button onClick={()=>del(p.id)} style={{background:"#ffe8e8",border:"none",borderRadius:9,padding:"8px 14px",cursor:"pointer",display:"flex",alignItems:"center",gap:6,fontSize:13,fontWeight:600,color:"#c1440e"}}><Ic n="trash" s={14} c="#c1440e"/>Remover</button>
              </div>
            </Card>
          ))}
        </div>
      }
      <FAB onClick={()=>{setStep(1);setSheet(true)}} label="Novo pedido"/>
      {sheet&&<Sheet title="Novo Pedido" onClose={reset} full>{renderStep()}</Sheet>}
    </>
  );
}

// ── CARDÁPIO ──────────────────────────────────────────────────────────────────
function Cardapio({cardapio,setCardapio,toast}){
  const[sheet,setSheet]=useState(null),[catFiltro,setCatFiltro]=useState("Todos");
  const[form,setForm]=useState({nome:"",descricao:"",valor:"",categoria:"Marmita"});
  const cats=["Marmita","Bebida","Sobremesa","Adicional","Outro"];
  const openNew=()=>{setForm({nome:"",descricao:"",valor:"",categoria:"Marmita"});setSheet("new")};
  const openEdit=c=>{setForm({nome:c.nome,descricao:c.descricao||"",valor:String(c.valor),categoria:c.categoria||"Marmita"});setSheet(c)};
  const save=async()=>{
    if(!form.nome.trim())return toast("Informe o nome.","error");
    if(!form.valor||isNaN(Number(form.valor)))return toast("Valor inválido.","error");
    const list=sheet==="new"?[...cardapio,{...form,id:Date.now(),valor:Number(form.valor)}]:cardapio.map(c=>c.id===sheet.id?{...c,...form,valor:Number(form.valor)}:c);
    await DB.set("clauq:cardapio",list);setCardapio(list);setSheet(null);
    toast(sheet==="new"?"Item adicionado!":"Atualizado!","success");
  };
  const del=async id=>{
    if(!confirm("Remover item?"))return;
    const list=cardapio.filter(c=>c.id!==id);
    await DB.set("clauq:cardapio",list);setCardapio(list);toast("Removido.","success");
  };
  const shown=catFiltro==="Todos"?cardapio:cardapio.filter(c=>c.categoria===catFiltro);
  return(
    <>
      <SHead title={`Cardápio (${cardapio.length})`}/>
      <div style={{display:"flex",gap:8,overflowX:"auto",marginBottom:16,paddingBottom:4}}>
        {["Todos",...cats].map(cat=>(
          <button key={cat} onClick={()=>setCatFiltro(cat)} style={{background:catFiltro===cat?T.accent:"#f0e8df",color:catFiltro===cat?"#fff":T.sub,border:"none",borderRadius:20,padding:"8px 16px",fontSize:13,fontWeight:600,cursor:"pointer",whiteSpace:"nowrap",flexShrink:0}}>{cat}</button>
        ))}
      </div>
      {shown.length===0?<div style={{textAlign:"center",padding:40,color:T.sub}}>Nenhum item. Adicione!</div>
        :<div style={{display:"flex",flexDirection:"column",gap:10,paddingBottom:90}}>
          {shown.map(item=>(
            <Card key={item.id}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                <div style={{flex:1}}>
                  <div style={{fontWeight:700,fontSize:16,color:T.text}}>{item.nome}</div>
                  {item.descricao&&<div style={{fontSize:13,color:T.sub,marginTop:2}}>{item.descricao}</div>}
                  <span style={{display:"inline-block",background:"#f0e8df",color:T.sub,borderRadius:6,padding:"2px 8px",fontSize:11,fontWeight:600,marginTop:6}}>{item.categoria}</span>
                </div>
                <div style={{fontFamily:"'DM Serif Display',serif",fontSize:20,color:T.accent,fontWeight:700,flexShrink:0,marginLeft:10}}>{fmt(item.valor)}</div>
              </div>
              <div style={{display:"flex",gap:8,marginTop:10}}>
                <button onClick={()=>openEdit(item)} style={{background:"#f0e8df",border:"none",borderRadius:9,padding:"8px 14px",cursor:"pointer",display:"flex",alignItems:"center",gap:6,fontSize:13,fontWeight:600,color:T.sub}}><Ic n="edit" s={14} c={T.sub}/>Editar</button>
                <button onClick={()=>del(item.id)} style={{background:"#ffe8e8",border:"none",borderRadius:9,padding:"8px 14px",cursor:"pointer",display:"flex",alignItems:"center",gap:6,fontSize:13,fontWeight:600,color:"#c1440e"}}><Ic n="trash" s={14} c="#c1440e"/>Remover</button>
              </div>
            </Card>
          ))}
        </div>
      }
      <FAB onClick={openNew} label="Novo item"/>
      {sheet&&(
        <Sheet title={sheet==="new"?"Novo Item":"Editar Item"} onClose={()=>setSheet(null)}>
          <Inp label="Nome *" value={form.nome} onChange={e=>setForm({...form,nome:e.target.value})}/>
          <Inp label="Descrição" value={form.descricao} onChange={e=>setForm({...form,descricao:e.target.value})}/>
          <Inp label="Valor (R$) *" type="number" min="0" step="0.01" value={form.valor} onChange={e=>setForm({...form,valor:e.target.value})}/>
          <div style={{marginBottom:14}}>
            <label style={{display:"block",fontSize:12,fontWeight:600,color:T.sub,marginBottom:8,textTransform:"uppercase",letterSpacing:.5}}>Categoria</label>
            <div style={{display:"flex",flexWrap:"wrap",gap:8}}>
              {cats.map(c=><button key={c} onClick={()=>setForm({...form,categoria:c})} style={{background:form.categoria===c?T.accent:"#f0e8df",color:form.categoria===c?"#fff":T.sub,border:"none",borderRadius:20,padding:"9px 18px",fontSize:14,fontWeight:600,cursor:"pointer"}}>{c}</button>)}
            </div>
          </div>
          <div style={{display:"flex",gap:10,marginTop:8}}>
            <Btn variant="ghost" onClick={()=>setSheet(null)} full>Cancelar</Btn>
            <Btn onClick={save} full>{sheet==="new"?"Adicionar":"Salvar"}</Btn>
          </div>
        </Sheet>
      )}
    </>
  );
}

// ── RELATÓRIO ─────────────────────────────────────────────────────────────────
function Relatorio({pedidos,printer,toast}){
  const mesAtual=monthYear(today()),meses=[...new Set(pedidos.map(p=>monthYear(p.data)))].sort().reverse();
  const[mes,setMes]=useState(mesAtual),[printing,setPrinting]=useState(false);
  const lista=pedidos.filter(p=>monthYear(p.data)===mes),total=lista.reduce((s,p)=>s+Number(p.valor),0);
  const porDia={};lista.forEach(p=>{porDia[p.data]=(porDia[p.data]||0)+Number(p.valor)});
  const dias=Object.keys(porDia).sort(),maxVal=Math.max(...Object.values(porDia),1);
  const porCli={};lista.forEach(p=>{porCli[p.cliente]=(porCli[p.cliente]||0)+Number(p.valor)});
  const topCli=Object.entries(porCli).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const porItem={};lista.forEach(p=>{(p.itens||"").split(", ").forEach(it=>{const m=it.match(/(\d+)x (.+)/);if(m)porItem[m[2]]=(porItem[m[2]]||0)+Number(m[1])})});
  const topItm=Object.entries(porItem).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const btOn=printer.status==="on";
  const printTermico=async()=>{
    setPrinting(true);
    const[m,a]=mes.split("/"),nomeMes=new Date(`${a}-${m}-01`).toLocaleDateString("pt-BR",{month:"long",year:"numeric"});
    const lines=[{type:"center",text:"SISTEMA CLAUQ",bold:true,double:true},{type:"center",text:"RELATORIO MENSAL",bold:true},{type:"center",text:nomeMes.toUpperCase()},{sep:true},{type:"left",text:`Pedidos: ${lista.length}`},{type:"left",text:`Faturamento: ${fmt(total)}`,bold:true},{type:"left",text:`Ticket medio: ${fmt(total/(lista.length||1))}`},{sep:true},{type:"left",text:"TOP CLIENTES:",bold:true},...topCli.map(([n,v],i)=>({type:"left",text:`${i+1}. ${n.slice(0,16).padEnd(16)} ${fmt(v)}`})),{sep:true},{type:"left",text:"MAIS PEDIDOS:",bold:true},...topItm.map(([n,q],i)=>({type:"left",text:`${i+1}. ${n.slice(0,20).padEnd(20)} ${q}x`})),{sep:true},{type:"center",text:"Sistema ClauQ"},{type:"center",text:" "}];
    const res=await printer.print(buildReceipt(lines));
    toast(res.ok?"Relatório impresso!":"Erro: "+res.err,res.ok?"success":"error");setPrinting(false);
  };
  return(
    <>
      <SHead title="Relatório" right={<select value={mes} onChange={e=>setMes(e.target.value)} style={{padding:"8px 12px",borderRadius:10,border:`1.5px solid ${T.border}`,background:T.inp,fontSize:13,color:T.text,outline:"none"}}>{meses.length===0?<option value={mesAtual}>{mesAtual}</option>:meses.map(m=><option key={m}>{m}</option>)}</select>}/>
      {lista.length===0?<div style={{textAlign:"center",padding:40,color:T.sub}}>Nenhum pedido neste mês.</div>
        :<>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:16}}>
            {[{label:"Pedidos",value:lista.length,color:"#3d7a5f"},{label:"Faturamento",value:fmt(total),color:T.accent},{label:"Ticket médio",value:fmt(total/lista.length),color:"#a05a20"},{label:"Dias ativos",value:dias.length,color:"#5c3d8a"}].map(m=>(
              <Card key={m.label} style={{padding:"14px 16px"}}><div style={{fontFamily:"'DM Serif Display',serif",fontSize:m.value.toString().length>7?15:19,color:m.color,fontWeight:700}}>{m.value}</div><div style={{fontSize:12,color:T.sub,marginTop:3}}>{m.label}</div></Card>
            ))}
          </div>
          {dias.length>0&&<Card style={{marginBottom:14,padding:"16px"}}><div style={{fontWeight:700,fontSize:14,color:T.text,marginBottom:12}}>Faturamento por dia</div><div style={{display:"flex",alignItems:"flex-end",gap:4,height:70,overflowX:"auto"}}>{dias.map(dia=>{const v=porDia[dia],h=Math.max(6,(v/maxVal)*60);return<div key={dia} style={{flex:1,minWidth:20,display:"flex",flexDirection:"column",alignItems:"center",gap:3}}><div style={{width:"100%",height:h,background:T.accent,borderRadius:"4px 4px 0 0"}} title={`${dia}: ${fmt(v)}`}/><div style={{fontSize:8,color:T.sub}}>{dia.slice(8)}</div></div>})}</div></Card>}
          {topCli.length>0&&<Card style={{marginBottom:10}}><div style={{fontWeight:700,fontSize:14,color:T.text,marginBottom:10}}>🏆 Top Clientes</div>{topCli.map(([nome,val],i)=><div key={nome} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"7px 0",borderBottom:i<topCli.length-1?`1px solid ${T.border}`:"none"}}><span style={{fontSize:14,color:T.text}}>{["🥇","🥈","🥉"][i]||`${i+1}.`} {nome}</span><span style={{fontFamily:"'DM Serif Display',serif",fontSize:14,color:T.accent}}>{fmt(val)}</span></div>)}</Card>}
          {topItm.length>0&&<Card style={{marginBottom:100}}><div style={{fontWeight:700,fontSize:14,color:T.text,marginBottom:10}}>🍽 Mais pedidos</div>{topItm.map(([nome,qtd],i)=><div key={nome} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"7px 0",borderBottom:i<topItm.length-1?`1px solid ${T.border}`:"none"}}><span style={{fontSize:14,color:T.text}}>{i+1}. {nome}</span><span style={{fontSize:13,color:T.accent,fontWeight:700}}>{qtd}x</span></div>)}</Card>}
          <div style={{position:"fixed",bottom:72,left:0,right:0,maxWidth:480,margin:"0 auto",padding:"0 16px"}}>
            {btOn?<Btn full variant="green" icon="print" onClick={printTermico} disabled={printing}>{printing?"Imprimindo...":"🖨 Imprimir na térmica"}</Btn>
              :<Btn full variant="ghost" icon="print" onClick={()=>{const[m,a]=mes.split("/"),nm=new Date(`${a}-${m}-01`).toLocaleDateString("pt-BR",{month:"long",year:"numeric"}),w=window.open("","_blank");w.document.write(`<html><head><title>Relatório</title><style>body{font-family:Georgia,serif;padding:20px}table{width:100%;border-collapse:collapse}th{background:#f5e6d3;padding:8px;text-align:left}td{padding:8px;border-bottom:1px solid #eee}</style></head><body><h2>📊 Sistema ClauQ — ${nm}</h2><p>Pedidos: ${lista.length} | Faturamento: R$ ${total.toFixed(2)}</p><h3>Top Clientes</h3><table><thead><tr><th>Cliente</th><th>Total</th></tr></thead><tbody>${topCli.map(([n,v])=>`<tr><td>${n}</td><td>R$ ${v.toFixed(2)}</td></tr>`).join("")}</tbody></table><script>window.print()<\/script></body></html>`);w.document.close()}}>Imprimir relatório</Btn>
            }
          </div>
        </>
      }
    </>
  );
}

// ── BLUETOOTH ─────────────────────────────────────────────────────────────────
function BTSetup({printer}){
  const{status,name,connect,disconnect}=printer,[loading,setLoading]=useState(false),[err,setErr]=useState(null);
  const color={on:"#3d7a5f",connecting:"#a05a20",off:"#8a6a50",error:"#c1440e"}[status];
  const label={on:`Conectado: ${name}`,connecting:"Conectando...",off:"Desconectado",error:"Erro de conexão"}[status];
  const handleConnect=async()=>{setLoading(true);setErr(null);const res=await connect();if(!res.ok)setErr(res.err);setLoading(false)};
  return(
    <div style={{paddingBottom:90}}>
      <Card style={{marginBottom:20}}>
        <div style={{display:"flex",alignItems:"center",gap:14}}>
          <div style={{width:48,height:48,borderRadius:14,background:color+"18",display:"flex",alignItems:"center",justifyContent:"center"}}><Ic n={status==="on"?"wifi":"nobt"} s={24} c={color}/></div>
          <div><div style={{fontWeight:700,fontSize:16,color:T.text}}>Impressora Térmica</div><div style={{fontSize:13,color,marginTop:2}}>{label}</div></div>
        </div>
      </Card>
      {err&&<div style={{background:"#fff0f0",border:"1px solid #fca5a5",borderRadius:12,padding:"12px 16px",marginBottom:16,fontSize:13,color:"#c1440e"}}>⚠️ {err}</div>}
      <Card style={{marginBottom:20}}>
        <div style={{fontWeight:700,fontSize:15,color:T.text,marginBottom:12}}>Como conectar</div>
        {[{n:"1",t:"Ligue a impressora térmica."},{n:"2",t:"Pareie no Bluetooth do celular (Configurações → Bluetooth)."},{n:"3",t:'Toque em "Conectar" abaixo e selecione a impressora na lista.'},{n:"4",t:"Pronto! Use o botão 🖨 nos pedidos."}].map(s=>(
          <div key={s.n} style={{display:"flex",gap:12,marginBottom:12}}>
            <div style={{width:28,height:28,borderRadius:14,background:T.accent,color:"#fff",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:700,fontSize:13,flexShrink:0}}>{s.n}</div>
            <div style={{fontSize:14,color:T.text,paddingTop:4}}>{s.t}</div>
          </div>
        ))}
        <div style={{background:"#fffbeb",border:"1px solid #fde68a",borderRadius:10,padding:"10px 14px",marginTop:4}}>
          <div style={{fontSize:12,color:"#92400e"}}>⚠️ Web Bluetooth funciona no <strong>Chrome para Android</strong>. No iPhone use a impressão normal.</div>
        </div>
      </Card>
      <div style={{position:"fixed",bottom:72,left:0,right:0,maxWidth:480,margin:"0 auto",padding:"0 16px"}}>
        {status==="on"
          ?<Btn full variant="danger" icon="nobt" onClick={disconnect}>Desconectar impressora</Btn>
          :<Btn full variant="green" icon="wifi" onClick={handleConnect} disabled={loading||status==="connecting"}>{loading||status==="connecting"?"Procurando...":"Conectar impressora"}</Btn>}
      </div>
    </div>
  );
}

// ── APP ROOT ──────────────────────────────────────────────────────────────────
function App(){
  const[screen,setScreen]=useState("home"),[clientes,setClientes]=useState([]),[pedidos,setPedidos]=useState([]),[cardapio,setCardapio]=useState([]),[toast,setToast]=useState(null),[loading,setLoading]=useState(true);
  const printer=usePrinter();
  const showToast=(msg,type="success")=>setToast({msg,type,id:Date.now()});
  useEffect(()=>{
    (async()=>{
      const[c,p,ca]=await Promise.all([DB.get("clauq:clientes"),DB.get("clauq:pedidos"),DB.get("clauq:cardapio")]);
      setClientes(c||[]);setPedidos(p||[]);setCardapio(ca||[]);setLoading(false);
    })();
  },[]);
  const NAV=[{id:"home",label:"Início",icon:"home"},{id:"clientes",label:"Clientes",icon:"users"},{id:"pedidos",label:"Pedidos",icon:"cart"},{id:"cardapio",label:"Cardápio",icon:"menu"},{id:"relatorio",label:"Relatório",icon:"chart"}];
  const btOn=printer.status==="on";
  if(loading)return(
    <div style={{height:"100vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",background:T.header,gap:12}}>
      <span style={{fontSize:52}}>🍱</span>
      <span style={{fontFamily:"'DM Serif Display',serif",fontSize:24,color:"#fdf0df"}}>Sistema ClauQ</span>
      <span style={{fontSize:13,color:"#c8a070"}}>Carregando...</span>
    </div>
  );
  return(
    <>
      <header style={{background:T.header,padding:"12px 16px",display:"flex",alignItems:"center",justifyContent:"space-between",flexShrink:0}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <span style={{fontSize:22}}>🍱</span>
          <div>
            <div style={{fontFamily:"'DM Serif Display',serif",color:"#fdf0df",fontSize:18,lineHeight:1.1}}>Sistema ClauQ</div>
            {screen!=="home"&&<div style={{fontSize:11,color:"#c8a070"}}>{NAV.find(n=>n.id===screen)?.label||"Bluetooth"}</div>}
          </div>
        </div>
        <button onClick={()=>setScreen("bluetooth")} style={{background:btOn?"#0f3321":"rgba(255,255,255,.1)",border:"none",borderRadius:20,padding:"7px 13px",display:"flex",alignItems:"center",gap:6,cursor:"pointer"}}>
          <Ic n={btOn?"wifi":"nobt"} s={15} c={btOn?"#4ade80":"#c8a070"}/>
          <span style={{fontSize:11,color:btOn?"#4ade80":"#c8a070"}}>{btOn?printer.name?.split(" ")[0]||"BT":"BT"}</span>
        </button>
      </header>
      <main style={{flex:1,padding:"16px 16px 0",overflowY:"auto"}}>
        {screen==="home"&&<Home clientes={clientes} pedidos={pedidos} setScreen={setScreen}/>}
        {screen==="clientes"&&<Clientes clientes={clientes} setClientes={setClientes} toast={showToast}/>}
        {screen==="pedidos"&&<Pedidos clientes={clientes} pedidos={pedidos} setPedidos={setPedidos} cardapio={cardapio} toast={showToast} printer={printer}/>}
        {screen==="cardapio"&&<Cardapio cardapio={cardapio} setCardapio={setCardapio} toast={showToast}/>}
        {screen==="relatorio"&&<Relatorio pedidos={pedidos} printer={printer} toast={showToast}/>}
        {screen==="bluetooth"&&<BTSetup printer={printer}/>}
      </main>
      <nav style={{background:"#fff",borderTop:`1px solid ${T.border}`,display:"flex",padding:"6px 0 8px",flexShrink:0,boxShadow:"0 -4px 20px rgba(28,15,0,.08)"}}>
        {NAV.map(n=>{
          const active=screen===n.id;
          return(
            <button key={n.id} onClick={()=>setScreen(n.id)} style={{flex:1,background:"none",border:"none",display:"flex",flexDirection:"column",alignItems:"center",gap:3,padding:"4px 0",cursor:"pointer"}}>
              <div style={{width:32,height:32,borderRadius:10,background:active?T.accent+"18":"transparent",display:"flex",alignItems:"center",justifyContent:"center"}}>
                <Ic n={n.icon} s={20} c={active?T.accent:T.sub} sw={active?2.5:2}/>
              </div>
              <span style={{fontSize:10,fontWeight:active?700:500,color:active?T.accent:T.sub}}>{n.label}</span>
            </button>
          );
        })}
      </nav>
      {toast&&<Toast key={toast.id} msg={toast.msg} type={toast.type} onDone={()=>setToast(null)}/>}
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
